[\"Rust\",\"后端开发\",\"教程\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Rust Axum微服务实战 | 任务队列与重试机制\",\n    \"description\": \"从零搭建基于 Rust Axum 的异步微服务：任务队列、后台 worker、指数退避重试与优雅关闭，配完整项目结构与 Docker 部署示例，助你稳定应对高并发。\",\n    \"content\": \"导语：99%程序员被异步任务折磨到秃头？这套Rust微服务架构让你一夜回到18岁\\n关注梦兽编程微信公众号，轻松入门Rust\\n你有没有在凌晨3点被手机震醒，然后发现生产环境的服务器又双叒叕挂了？用户投诉邮件像雪花一样飞来，而你只能在床上怀疑人生：为什么我的异步任务总是这么不听话？\\n如果你点头如捣蒜，那恭喜你找对地方了。今天我要教你用Rust的Axum框架，构建一个比瑞士手表还精准、比德国汽车还可靠的异步微服务。\\n异步微服务就像一家忙碌的咖啡厅 想象一下，你开了一家咖啡厅。顾客点单后，你不能傻傻地站在那里等咖啡煮好，否则后面排队的客人早就跑光了。聪明的做法是：接单→交给后厨→继续接下一单。\\nAxum微服务的工作原理就是这样。HTTP请求就像点咖啡的顾客，后台任务就像煮咖啡的师傅，而消息队列就是那张写满订单的小纸条。\\n首先，我们来搭建项目的基础依赖：\\n[dependencies] axum = \\u0026#34;0.7\\u0026#34; tokio = { version = \\u0026#34;1\\u0026#34;, features = [\\u0026#34;full\\u0026#34;] } tokio-util = \\u0026#34;0.7\\u0026#34; serde = { version = \\u0026#34;1\\u0026#34;, features = [\\u0026#34;derive\\u0026#34;] } serde_json = \\u0026#34;1\\u0026#34; tower = \\u0026#34;0.4\\u0026#34; 然后定义我们的任务结构，这就像咖啡厅的订单单：\\nuse serde::{Deserialize, Serialize}; use tokio::sync::mpsc; use std::sync::Arc; #[derive(Debug, Clone, Serialize, Deserialize)] pub struct Job { pub id: u64, pub task_type: String, pub payload: String, } type JobSender = mpsc::Sender\\u0026lt;Job\\u0026gt;; type JobReceiver = mpsc::Receiver\\u0026lt;Job\\u0026gt;; 接下来创建我们的\\u0026quot;点单台\\u0026quot;：\\nuse axum::{routing::post, Router, extract::Extension, Json}; // 这就是我们的\\u0026#34;点单台\\u0026#34; async fn submit_job( Extension(sender): Extension\\u0026lt;Arc\\u0026lt;JobSender\\u0026gt;\\u0026gt;, Json(payload): Json\\u0026lt;Job\\u0026gt;, ) -\\u0026gt; \\u0026amp;\\u0026#39;static str { match sender.send(payload).await { Ok(_) =\\u0026gt; \\u0026#34;✅ 您的任务已接收，请稍等片刻\\u0026#34;, Err(_) =\\u0026gt; \\u0026#34;❌ 任务队列已满，请稍后再试\\u0026#34; } } async fn health_check() -\\u0026gt; \\u0026amp;\\u0026#39;static str { \\u0026#34;服务器状态：精神抖擞！\\u0026#34; } fn create_app(sender: Arc\\u0026lt;JobSender\\u0026gt;) -\\u0026gt; Router { Router::new() .route(\\u0026#34;/submit\\u0026#34;, post(submit_job)) .route(\\u0026#34;/health\\u0026#34;, get(health_check)) .layer(Extension(sender)) } 后台任务队列：像快递分拣中心一样高效 你知道快递公司是怎么处理海量包裹的吗？他们有一个巨大的分拣中心，包裹通过传送带源源不断地流入，工人们井然有序地处理每一个包裹。\\nmpsc channel就是我们的\\u0026quot;传送带\\u0026quot;，而worker就是那些勤劳的\\u0026quot;分拣工人\\u0026quot;：\\nuse tokio_util::sync::CancellationToken; use tokio::time::{sleep, Duration}; async fn worker_loop(mut receiver: JobReceiver, cancel: CancellationToken) { println!(\\u0026#34;🚀 后台工人开始上班了\\u0026#34;); while let Some(job) = tokio::select! { job = receiver.recv() =\\u0026gt; job, _ = cancel.cancelled() =\\u0026gt; { println!(\\u0026#34;🛑 收到下班通知，准备收拾东西\\u0026#34;); None } } { println!(\\u0026#34;🔧 开始处理任务: {:?}\\u0026#34;, job); process_job_with_retry(\\u0026amp;job).await; } println!(\\u0026#34;👷 工人下班了，今天辛苦了！\\u0026#34;); } 重试机制：追女神的正确姿势 失败了不要紧，重要的是要有策略。就像追女神一样，第一次被拒绝不能马上放弃，但也不能死缠烂打。要有间隔，要有诚意，要有限度。\\n我们的重试机制就是这样的绅士：\\nasync fn process_job_with_retry(job: \\u0026amp;Job) { let mut attempts = 0; let max_retries = 3; loop { attempts += 1; let success = try_process_job(job).await; if success { println!(\\u0026#34;✅ 任务 {} 成功完成！一次搞定，就是这么优秀\\u0026#34;, job.id); break; } if attempts \\u0026gt;= max_retries { println!(\\u0026#34;💔 任务 {} 试了{}次还是不行，我们放弃吧\\u0026#34;, job.id, max_retries); // 这里可以把失败的任务记录到死信队列 break; } let delay = Duration::from_secs(2_u64.pow(attempts - 1)); // 指数退避 println!(\\u0026#34;⚠️ 任务 {} 第{}次尝试失败，休息{}秒再来\\u0026#34;, job.id, attempts, delay.as_secs()); sleep(delay).await; } } async fn try_process_job(job: \\u0026amp;Job) -\\u0026gt; bool { // 模拟任务处理 // 这里可以调用数据库、发送邮件、调用第三方API等 println!(\\u0026#34;🔄 正在处理任务类型: {}\\u0026#34;, job.task_type); // 模拟50%的失败率来测试重试机制 use rand::Rng; let mut rng = rand::thread_rng(); let success = rng.gen_bool(0.5); if success { println!(\\u0026#34;🎉 任务处理成功！\\u0026#34;); } else { println!(\\u0026#34;😞 任务处理失败，可能网络有问题\\u0026#34;); } success } 优雅关闭：像绅士一样说再见 你见过那种离开聚会时悄无声息溜走的人吗？那叫\\u0026quot;法式离别\\u0026quot;，虽然省事但有点不礼貌。我们的服务器要做绅士，关闭时要和每个组件都好好道别。\\nCancellationToken就像一个温柔的管家，会礼貌地通知所有人：\\u0026ldquo;各位，该收工了\\u0026rdquo;：\\nuse axum::Server; use std::net::SocketAddr; #[tokio::main] async fn main() -\\u0026gt; Result\\u0026lt;(), Box\\u0026lt;dyn std::error::Error\\u0026gt;\\u0026gt; { println!(\\u0026#34;🚀 启动异步微服务...\\u0026#34;); // 创建任务队列 let (tx, rx) = mpsc::channel::\\u0026lt;Job\\u0026gt;(100); let tx = Arc::new(tx); // 创建取消令牌 let cancel = CancellationToken::new(); // 启动后台工人 let cancel_worker = cancel.clone(); let worker_handle = tokio::spawn(worker_loop(rx, cancel_worker)); // 创建应用 let app = create_app(tx.clone()); let addr = SocketAddr::from(([127, 0, 0, 1], 3000)); println!(\\u0026#34;🌐 服务器启动在 http://{}\\u0026#34;, addr); // 设置优雅关闭信号 let shutdown_signal = { let cancel = cancel.clone(); async move { // 等待Ctrl+C信号 tokio::signal::ctrl_c() .await .expect(\\u0026#34;无法监听关闭信号\\u0026#34;); println!(\\u0026#34;🛑 收到退出信号，开始优雅关闭...\\u0026#34;); cancel.cancel(); // 温柔地通知所有worker } }; // 启动HTTP服务器 let server = Server::bind(\\u0026amp;addr) .serve(app.into_make_service()) .with_graceful_shutdown(shutdown_signal); // 等待服务器和worker都完成 tokio::select! { _ = server =\\u0026gt; {}, _ = worker_handle =\\u0026gt; {}, } println!(\\u0026#34;👋 服务器已优雅关闭，再见！\\u0026#34;); Ok(()) } 完整的项目结构 为了让这个微服务更加完整，我们可以按照这样的目录结构组织代码：\\nsrc/ ├── main.rs # 主程序入口 ├── handlers/ # HTTP处理器 │ ├── mod.rs │ └── jobs.rs ├── workers/ # 后台任务处理器 │ ├── mod.rs │ └── job_worker.rs ├── models/ # 数据模型 │ ├── mod.rs │ └── job.rs └── config/ # 配置管理 ├── mod.rs └── settings.rs 这样的结构就像是一个井然有序的办公楼，每个部门都有自己的职责，但又能很好地协作。\\n测试我们的微服务 创建完成后，我们可以用curl来测试这个服务：\\n# 启动服务 cargo run # 健康检查 curl http://localhost:3000/health # 提交一个任务 curl -X POST http://localhost:3000/submit \\\\ -H \\u0026#34;Content-Type: application/json\\u0026#34; \\\\ -d \\u0026#39;{\\u0026#34;id\\u0026#34;: 1, \\u0026#34;task_type\\u0026#34;: \\u0026#34;email\\u0026#34;, \\u0026#34;payload\\u0026#34;: \\u0026#34;发送欢迎邮件\\u0026#34;}\\u0026#39; 你会看到控制台输出类似这样的日志：\\n🚀 后台工人开始上班了 🔧 开始处理任务: Job { id: 1, task_type: \\u0026#34;email\\u0026#34;, payload: \\u0026#34;发送欢迎邮件\\u0026#34; } 🔄 正在处理任务类型: email 🎉 任务处理成功！ ✅ 任务 1 成功完成！一次搞定，就是这么优秀 进阶挑战：让你的微服务更加性感 基础版本搭建完成后，你还可以解锁这些高级技能：\\n持久化存储：把任务状态保存到Redis或数据库，这样重启服务器也不会丢失进度，就像游戏的存档功能。\\n// 使用Redis作为任务状态存储 use redis::{Client, Connection, RedisResult}; async fn save_job_status(job_id: u64, status: \\u0026amp;str) -\\u0026gt; RedisResult\\u0026lt;()\\u0026gt; { let client = Client::open(\\u0026#34;redis://127.0.0.1/\\u0026#34;)?; let mut con = client.get_connection()?; con.set(format!(\\u0026#34;job:{}\\u0026#34;, job_id), status)?; Ok(()) } 任务状态查询：添加一个/status/:id接口，让用户随时查看任务进度，比外卖追踪还贴心。\\nasync fn get_job_status( Path(job_id): Path\\u0026lt;u64\\u0026gt; ) -\\u0026gt; Result\\u0026lt;Json\\u0026lt;JobStatus\\u0026gt;, StatusCode\\u0026gt; { // 从Redis或数据库查询任务状态 // 返回JSON格式的状态信息 } 负载均衡：部署多个实例，让它们像蚂蚁搬家一样协同工作。\\n监控告警：集成Prometheus和Grafana，让你比老板还先知道系统有问题。\\n为什么选择Rust？ 有人可能会问：为什么不用Node.js或Go？答案很简单：\\nRust就像那个班级里既聪明又靠谱的学霸，性能爆表的同时还能保证内存安全。用Rust写的服务，运行起来比跑车还稳，比飞机还快，关键是几乎不会崩溃。\\n而且Rust的异步编程模型天生就是为高并发场景设计的，处理10万个并发连接就像喝水一样轻松。\\n性能对比：\\n内存使用：比Java节省60%，比Python节省80% CPU效率：比Node.js快2-3倍，接近C++的性能 并发能力：轻松处理百万级连接，而且资源占用极低 部署到生产环境 当你的微服务开发完成后，部署也要讲究策略。推荐使用Docker容器化部署：\\nFROM rust:1.70 as builder WORKDIR /app COPY . . RUN cargo build --release FROM debian:bookworm-slim RUN apt-get update \\u0026amp;\\u0026amp; apt-get install -y ca-certificates \\u0026amp;\\u0026amp; rm -rf /var/lib/apt/lists/* COPY --from=builder /app/target/release/async-microservice /usr/local/bin/ EXPOSE 3000 CMD [\\u0026#34;async-microservice\\u0026#34;] 配合Kubernetes或Docker Compose，你就能轻松实现水平扩展和滚动更新。\\n总结 构建一个生产级的异步微服务，就像组装一台精密仪器。每个组件都要精心设计，但更重要的是它们之间的协调配合。\\nAxum + Tokio的组合，给了我们一套既强大又优雅的工具。用好了它们，你的服务器就能像瑞士钟表一样精准运行，再也不用担心半夜被电话吵醒了。\\n核心要点回顾：\\n异步架构：像咖啡厅一样处理请求，永远不让客户等待\\n任务队列：用mpsc channel构建高效的消息传递机制\\n重试策略：智能的错误恢复，失败了也要优雅地再试\\n优雅关闭：像绅士一样告别，保证正在处理的任务不丢失\\n可扩展设计：模块化架构，方便后续功能扩展\\n现在，去构建你的第一个Rust微服务吧！记住，代码如人品，写优雅的代码就像做一个优雅的人。\\n当你的微服务在生产环境中稳定运行，处理着成千上万的请求时，你会感谢今天学到的这套架构。因为它不仅仅是代码，更是一种思维方式——用最优雅的方式解决最复杂的问题。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tutorials/rust/rust-axum-async-microservice-guide/\",\n    \"date\": \"2025-08-17\",\n    \"section\": \"tutorials\",\n    \"tags\": [\"Rust\",\"Axum\",\"Tokio\",\"异步\",\"微服务\",\"Backend\",\"教程\"],\n    \"categories\": [\"Rust\",\"后端开发\",\"教程\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Claude Code个性化设置 | Output Styles完全指南\",\n    \"description\": \"学习如何使用Claude Code最新的Output Styles功能，通过自定义System Prompt，将你的AI编程助手调教成资深架构师、TDD教练或任何你需要的角色。从预设人格到创造专属AI，本文为你提供详细指南和实战案例。\",\n    \"content\": \"\\n兄弟们，代码写得怎么样了？还在跟AI玩“你问我答”的初级游戏吗？\\n那套玩法已经过时了。\\n今天，我要给你看个能颠覆你编程方式的“核武器”——Claude Code最新推出的Output Styles功能。这玩意儿，说白了，就是让你给AI注入“灵魂”，把它从一个听话的工具，调教成你想要的任何“角色”。\\n想象一下，你的AI不再是那个只会机械吐代码的“工具人”，而是可以一秒化身成“资深架构师”帮你梳理遗留代码，下一秒又变成“TDD狂人”带你写出最牛的测试用例。\\n感觉来了吗？这已经不是简单的编程辅助了，这是在组建你自己的“AI梦之队”。\\n一、Output Styles：给你的AI装个“人格” 我们先来拆解下这个“Output Styles”到底是个什么神仙玩意儿。\\n简单粗暴地讲，它就是一套“AI人格切换器”。\\n传统的AI，你给它一个prompt，它给你一个答案。就像一个功能固定的计算器。而Output Styles，允许你直接修改Claude Code的“系统提示词”（System Prompt），从根上改变它的行为模式和说话风格。\\n这就像你不是在给你的“高达”下指令，而是在直接改造它的驾驶舱操作系统。你可以让它保留核心战斗力（比如写代码、操作文件），但彻底改变它的战斗风格。\\n二、官方“御三家”：三种预设人格 Claude官方先给你准备了三款“标准人格”，让你快速上手：\\n1. Default (默认人格) 这就是那个我们熟悉的、言简意赅的“编程特种兵”。话不多，活儿好。专为高效协作而生，没有废话，直奔主题。\\n2. Explanatory (导师人格) 这位就像你身边那个经验丰富、还特有耐心的技术总监。它在完成任务的同时，还会给你穿插各种“设计思路”和“技术选型”的深度见解。帮你不仅知其然，还知其所以然。\\n3. Learning (带教人格) 这简直是新人的福音。它会像个结对编程的教练，边做边教，甚至故意在代码里留下TODO(human)让你亲手补全，然后给你反馈。真正实现了“边做边学”的沉浸式体验。\\n三、如何召唤与切换“人格” 切换这些人格，就像在游戏里换皮肤一样简单。\\n想看看有谁可选？直接在终端输入：\\n/output-style 想直接指定某位“大神”上身？比如召唤“导师人格”：\\n/output-style explanatory 或者切换到“带教人格”：\\n/output-style learning 这些设定会直接保存在你项目本地的.claude/settings.local.json文件里，一次设定，整个项目通用，非常方便。\\n四、终极玩法：创造你自己的“AI神祇” 预设的玩腻了？重头戏来了——创造属于你自己的AI人格！\\n这才是Output Styles最恐怖的地方。你可以用自然语言，像写小说人物小传一样，去定义一个全新的AI风格。\\n比如，你想创造一个“代码安全审计官”：\\n/output-style:new 我想要一个严格的安全审计风格：先威胁建模，再静态/依赖/配置审计，输出CWE映射、修复PR草案和本地脚本。 这条指令下去，Claude就会为你生成一个全新的AI人格。这个“人格”文件会保存在~/.claude/output-styles目录下，是一个Markdown文件。你甚至可以把它放到项目级的.claude/output-styles目录里，让整个团队共享你创造的“AI专家”。\\n五、实战！让AI在真实场景中“秀肌肉” 光说不练假把式。我们来看几个能直接落地到你工作中的真实案例。\\n案例A：空降“屎山”项目？让“导师”给你画地图 刚接手一个堆积了五年的遗留代码库，两眼一抹黑？别慌。\\n召唤人格：\\n/output-style explanatory 下达指令：\\n“请为 services/order/ 目录做系统性走查，按模块输出架构图要点与常见反模式，并给我3条重构路线图。”\\nAI输出： 它会一边给你分析代码结构，一边穿插“Insights”解释为什么要这么设计，以及背后有哪些技术权衡。这哪是AI，这简直是请了个架构师给你做代码Consulting。\\n案例B：新人入职？让“教练”带他飞 团队来了个新人，没时间手把手教？让他跟AI结对。\\n召唤人格：\\n/output-style learning 下达指令：\\n“我们要给 UserService 增加批量导入，按TDD来：请先写失败用例，然后在实现里留下TODO(human)让我完成关键片段。”\\nAI输出： 它会严格按照TDD流程，先给你一个红色的测试，然后在业务代码里把框架搭好，把最核心的逻辑留给你填空。新人写完后，AI还会自动点评和给出改进建议。一套流程下来，新人想不成长都难。\\n案例C：产品经理催需求？让“PM”帮你怼回去 有时候，你需要一个懂产品的AI来帮你评估需求。\\n创造人格：\\n/output-style:new 我想要偏PM的风格：强调用户故事、影响评估、成功指标、边界用例与回滚预案，产出简洁评审结论。 下达指令：\\n“评审这个重构PR：补充用户故事、指标、风险与灰度策略；给出放行/阻塞结论。”\\nAI输出： 它会像一个资深产品经理一样，从用户价值、数据指标、风险控制等多个维度，给你生成一份可以直接贴到PR评论区的、结构化的评审报告。专业！\\n六、让AI的产出融入你的自动化流水线 更牛的是，你可以把这些强大的能力，集成到你的CI/CD或其他脚本里。\\n想让AI的分析结果只输出纯文本？\\nclaude -p \\u0026#39;summarize this data\\u0026#39; --output-format text \\u0026gt; summary.txt 想让AI的代码分析报告直接生成JSON？\\nclaude -p \\u0026#39;analyze this code for bugs\\u0026#39; --output-format json \\u0026gt; analysis.json 这为我们实现更复杂的AI Agent工作流，打开了想象力的大门。\\n总结：这不止是功能，这是一场革命 Claude Code的Output Styles，看似只是一个新功能，但它背后代表着一个重要的趋势：我们正在从“使用AI”走向“塑造AI”。\\n我们不再是满足于AI给我们的答案，而是开始主动去定义AI应该“成为谁”。\\n这让AI从一个冰冷的、标准化的工具，变成了一个个可以被我们“注入灵魂”的、个性化的虚拟团队成员。这才是真正的AI协作的未来。\\n别再犹豫了，现在就去试试，创造出第一个属于你自己的“AI大神”吧。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tools/ai-tools/output-styles-custom-ai-persona/\",\n    \"date\": \"2025-08-16\",\n    \"section\": \"tools\",\n    \"tags\": [\"AI\",\"Claude\",\"Claude Code\",\"Gemini\",\"CLI\",\"Programming\",\"DevTools\"],\n    \"categories\": [\"AI Tools\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Claude Code Tamagotchi：你的 VSCode 编程电子宠物与 AI 代码伙伴\",\n    \"description\": \"把编程变成一场养成游戏：Claude Code Tamagotchi 住进 VSCode 状态栏，基于你真实的编码行为生成情绪与反馈，提供陪伴感与温柔提醒。内含 3 分钟上手指南（npm/bun）、状态存档与交互命令。\",\n    \"content\": \"Claude Code Tamagotchi：你的 VSCode 编程电子宠物与 AI 代码伙伴 别卷了，你的代码里长出了一只会关心你的“猫”！\\n嘿，兄弟。\\n你是不是也经常这样：夜深人静，只有你和屏幕上闪烁的光标在对峙。Bug像打不完的地鼠，产品经理的需求像永无止境的紧箍咒。你敲下一行行代码，感觉自己像个没有感情的机器，全世界只剩下你一个人在战斗。\\n孤独吗？有点。\\n但如果，你的代码编辑器里，突然“活”过来一个会呼吸、会撒娇、还会吐槽你的小家伙呢？\\n说出来你可能不信，但就在我快要被一个诡异的bug逼疯的深夜，我的VSCode状态栏里，就出现了这么个小东西。它不是冷冰冰的插件，更像一个……嗯，一个有体温的“代码伴侣”。\\n这玩意儿，就是今天的主角——Claude Code Tamagotchi，一个能住在你IDE里的电子宠物。\\n这不只是个插件，这是个有“灵魂”的队友（特点与亮点） 忘掉那些死板的工具吧。这个小家伙是“活”的。\\n它真的住在你的状态栏里，会随着你的操作呼吸、变换表情。你疯狂敲代码，它就在旁边给你加油鼓劲；你停下来摸鱼超过5分钟，它会用无辜的眼神瞅着你，仿佛在说：“主人，你怎么不动了？”\\n最绝的是，它有自己的一套“生命体征”——饥饿、能量、清洁、快乐。\\n你写代码写久了，它会饿，会弹出个小气泡提醒你：“我饿了，喂我点吃的吧！” 你得像个老父亲一样，在终端里敲下命令给它“投喂”一块披萨。你调试代码崩溃了，它会难过，甚至会安慰你：“别灰心，bug是程序员最好的朋友（才怪）！”\\n这感觉太奇妙了。它就像一个真正懂你的朋友，把枯燥的编程变成了一场养成游戏。你不再是孤军奋战，你有了个“宠”，需要你照顾，也同样在用它的方式陪伴你。\\n它怎么就那么“懂”你？（工作原理与本地存档） 别以为这是什么魔法。这个小家伙的“情商”背后，是实实在在的技术。\\n它通过监控你的编码活动来判断你的状态。比如，它会分析你的打字频率、代码提交记录、调试器的状态。你长时间没有键盘输入，它就判定你在“休息”或者“摸鱼”。你的代码库有了新的commit，它就认为你完成了一项工作，会为你开心。\\n它的所有记忆和状态，都保存在本地的 ~/.claude/pets/ 文件夹里。这意味着什么？意味着你关掉编辑器再打开，它还认识你！你的“宠物”是有记忆的，你们的“感情”是可以延续的。\\n更牛的是，它内置了200多种基于上下文的“想法”。它会评价你的代码风格，吐槽你的TODO List，甚至在你熬夜太久时，会弹出一条信息：“嘿，哥们，差不多得了，命要紧！”\\n那一刻，我真的感觉不是AI在提醒我，而是一个看不见的朋友在拍我的肩膀。\\n三分钟“领养”指南（安装与快速上手） 心动了？别急，领养手续超级简单，三分钟搞定。\\n第一步：全局安装 打开你的终端，像迎接一位新伙伴一样，敲下这行命令：\\nnpm install -g claude-code-tamagotchi\\n（如果你用bun，那就 bun add -g claude-code-tamagotchi）\\n第二步：唤醒它 找到你电脑里的 ~/.claude/settings.json 文件（没有就创建一个），把下面的配置复制进去：\\n{ \\u0026#34;statusLine\\u0026#34;: { \\u0026#34;type\\u0026#34;: \\u0026#34;command\\u0026#34;, \\u0026#34;command\\u0026#34;: \\u0026#34;bunx claude-code-tamagotchi statusline\\u0026#34;, \\u0026#34;padding\\u0026#34;: 0 } } 搞定！现在重启你的VSCode，看看你的状态栏，是不是有个小眼睛在好奇地打量着你？\\n想跟它互动？直接在终端里输入 claude-code-tamagotchi feed pizza 就能喂它，或者输入 claude-code-tamagotchi play ball 陪它玩。它会用自己的方式给你回应。\\n这不只是好玩：它是对“卷”的温柔抵抗（价值与意义） 说实话，我们程序员的生活，有时候真的挺苦的。我们用代码构建了无数精彩的虚拟世界，但自己的世界却常常只剩下代码。\\n这个电子宠物，可能不会帮你多写一行代码，也不会让你的程序跑得更快。\\n但它提供了一种更宝贵的东西——陪伴感和情绪价值。\\n它用一种最柔软、最有趣的方式提醒你：你是一个活生生的人，你需要休息，需要快乐，需要被关心。在这个追求极致效率、人人都像上了发条的时代，有这么一个小东西在你的代码世界里，傻傻地、认真地关心你，这本身就是一种温柔的抵抗。\\n它在告诉你，代码之外，还有生活。\\n所以，去领养一只吧。给你的编程生活，加一点点糖。\\n常见问题（FAQ） Q：支持哪些编辑器？ 目前以 VSCode 状态栏形态为主，其他编辑器可通过命令行集成状态输出。\\nQ：会不会上传我的代码或隐私？ 不会。宠物的状态和记忆存储在本地 ~/.claude/pets/，不读取你的代码内容，也不联网上传。\\nQ：命令行有哪些玩法？ claude-code-tamagotchi feed \\u0026lt;food\\u0026gt;、play \\u0026lt;toy\\u0026gt;、wash、sleep 等，具体以 --help 为准。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tools/ai-tools/claude-code-tamagotchi-your-ai-coding-buddy/\",\n    \"date\": \"2025-08-15\",\n    \"section\": \"tools\",\n    \"tags\": [\"Claude Code\",\"VSCode 插件\",\"电子宠物\",\"编程效率\",\"开发者健康\",\"状态栏插件\"],\n    \"categories\": [\"AI 工具\",\"开发者工具\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"用 scheduler.yield() 让你的网页应用飞起来⚡\",\n    \"description\": \"通过拆分大任务来保持UI流畅，就像聪明的餐厅服务员一样\",\n    \"content\": \"想象一下，你在一家很火的餐厅当服务员。突然来了一个大团餐订单，你要是埋头只顾着处理这一个订单，其他桌的客人就会觉得被冷落了，开始敲桌子催单。\\n网页应用也是这个道理。当主线程上有个长任务在埋头苦干时，浏览器就没法及时响应用户的点击和输入，页面就会变得像蜗牛一样慢，甚至直接卡住。\\n这时候就该 scheduler.yield() 出场了——它就像个聪明的服务员，懂得适时地说：\\u0026ldquo;我先去招呼一下其他客人，马上回来继续处理您的大订单！\\u0026rdquo;\\n1. 为什么要用 scheduler.yield()？ 如果你有个大函数在做繁重的工作，它会把主线程占着不让干别的活，比如响应点击事件。\\n当你在异步函数里加上 await scheduler.yield() 时：\\n函数会在那个点暂停一下 浏览器先去处理其他紧急任务 然后你的函数在新的循环回合中继续执行 async function 用户点击处理() { 显示即时反馈(); // 👌 快速UI更新 await scheduler.yield(); // 给主线程喘口气 执行繁重工作(); // 🛠️ 慢活放在后面 } 最妙的是：你的函数剩余部分会在其他类似任务之前运行。这意味着你的后续代码比新来的任务有更高的优先级。\\n2. 它和 setTimeout() 或 scheduler.postTask() 有什么不同？⏱️ 你也可以用 setTimeout 或 scheduler.postTask 来拆分长任务。但在那些情况下，你的剩余代码可能会在很多其他任务之后才运行，这就会导致延迟。\\n用 setTimeout 的例子：\\nfunction 大任务() { 第一部分(); setTimeout(第二部分, 0); // 稍后运行 } 如果已经有其他任务（比如 其他任务）在排队了，你的 第二部分 就要等到 其他任务 完成后才能运行。如果 其他任务 很慢，你的代码就得等更久。\\n用 scheduler.yield()：\\nasync function 大任务() { 第一部分(); await scheduler.yield(); 第二部分(); } 这时候浏览器会：\\n先让其他紧急任务跑完 然后优先回来执行你的 第二部分，而不是开始新的普通任务 结果就是 → 页面保持响应，你的工作也能更快完成。\\n3. 为什么在开发者工具里显示为\\u0026quot;运行微任务\\u0026quot;？ scheduler.yield() 返回一个 promise。当函数继续时，它是在微任务中执行的（就像普通的 await 那样）。\\n如果你看 Babel 编译后的异步代码，它会把 await 的结果放在 Promise.resolve(...).then(...) 里面。所以你会先看到\\u0026quot;运行微任务\\u0026quot;，然后才是你的代码继续执行。\\n4. 和 scheduler.postTask() 一起使用 📋 scheduler.yield() 也可以在 scheduler.postTask() 任务里面使用。 如果你不设置优先级，它的工作方式就和上面的例子一样。\\n如果你设置了低优先级（比如 \\u0026quot;background\\u0026quot;），那么即使在 yield 之后，你的后续代码仍然比其他普通任务的优先级低。\\n例子：\\nasync function 慢速后台工作() { 前半部分(); await scheduler.yield(); 后半部分(); } scheduler.postTask(慢速后台工作, { priority: \\u0026#34;background\\u0026#34; }) 这里会发生：\\n它仍然会在其他后台任务之前运行 但会先等高优先级任务完成 你也可以用 scheduler.postTask 来延迟任务：\\nscheduler.postTask(() =\\u0026gt; { console.log(\\u0026#34;大约2秒后运行\\u0026#34;); }, { delay: 2000 }); 5. 什么时候使用它？✅ 拆分大的 JavaScript 任务，让 UI 能够响应 改善输入延迟（提高 INP 分数） 给其他重要工作机会运行，但同时保持自己的任务优先级较高 💡 小贴士：可以把 scheduler.yield() 想象成对浏览器说：\\n\\u0026ldquo;我先让一让，但请让我在新任务开始前先完成我的工作。\\u0026rdquo;\\n就像那个聪明的餐厅服务员，懂得在忙碌中保持所有客人都满意，而不是只顾着一桌客人让其他人都等着急。\\n下次当你发现网页应用有点卡顿时，记得请出 scheduler.yield() 这个得力助手，让你的应用保持流畅如丝！\\n原文链接: rexai.top/js-news/scheduler-yield-web-app-faster\\n觉得这篇文章有帮助吗？\\n欢迎关注我的技术博客，获取更多前端性能优化和 JavaScript 开发技巧。我会持续分享实用的编程知识和最新的技术动态，帮助你在开发路上少走弯路！\\n如果你有其他关于性能优化的问题，或者想了解更多的 JavaScript 开发技巧，欢迎在评论区留言讨论。我们一起学习，共同进步！\\n\",\n    \"permalink\": \"https://rexai.top/js-news/scheduler-yield-web-app-faster/\",\n    \"date\": \"2025-08-15\",\n    \"section\": \"js-news\",\n    \"tags\": [\"javascript\",\"性能优化\",\"web开发\"],\n    \"categories\": [\"前端技术\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Rust + Axum = 王炸？手把手教你用“乐高”模式搭建高性能 Web 服务器！\",\n    \"description\": \"从 0 到 1 用 Axum 搭建现代高性能 Web 服务：路由、路径参数、查询参数、JSON、共享状态与中间件（日志、CORS），配完整代码示例与最佳实践。\",\n    \"content\": \"Rust + Axum = 王炸？手把手教你用“乐高”模式搭建高性能Web服务器！\\n你是不是也这样？\\n写多了Java，感觉自己像个“配置工程师”，满眼都是@Autowired和XML。\\n玩腻了Node.js，享受着异步的丝滑，却也为回调地狱和单线程的性能天花板而焦虑。\\n你听说过Rust，那个传说中运行起来快如闪电、内存安全到让GC（垃圾回收）下岗的“性能怪兽”。但每次看到 \\u0026amp;'a、mut、Arc\\u0026lt;Mutex\\u0026lt;T\\u0026gt;\\u0026gt; 这些符号，就感觉大脑CPU过载，默默地把“从入门到放弃”打在了公屏上。\\n如果我告诉你，用Rust写后端，不仅不难，甚至还像玩乐高积木一样有趣、直观、且优雅，你会信吗？\\n别急着反驳。今天，我们就请出主角——Axum，一个由创造了tokio（Rust异步运行时事实上的标准）的官方团队打造的Web框架。它将彻底颠覆你对Rust后端开发的认知。\\n准备好了吗？让我们一起，用最骚的方式，搭一个快到没朋友的Web服务！\\n第一步：准备“食材”——把Axum请进你的项目 任何一个伟大的工程，都始于一个简单的Cargo.toml（你可以把它理解为Rust项目的package.json或pom.xml）。\\n打开你的Cargo.toml，把下面这两行“神兵利器”加到[dependencies]下面：\\naxum = \\u0026#34;0.7\\u0026#34; tokio = { version = \\u0026#34;1\\u0026#34;, features = [\\u0026#34;full\\u0026#34;] } 简单解释一下这两个“乐高零件”：\\naxum: 我们今天的主角，负责处理HTTP请求的“总指挥官”。 tokio: Rust世界的“红牛”，提供了强大的异步运行时环境。features = [\\u0026quot;full\\u0026quot;]意思是，别客气，把所有功能都给我满上！ 当然，你也可以像个老炮儿一样，在命令行里潇洒地敲下：\\ncargo add axum cargo add tokio --features full 搞定！我们的厨房已经准备好了。\\n第二步：第一道“开胃菜”——你的第一个Axum应用 光说不练假把式。让我们直接上代码，看看一个最基础的Axum服务器长啥样。\\n在你的main.rs里，贴上这段代码：\\nuse axum::{ routing::get, Router, }; use std::net::SocketAddr; #[tokio::main] async fn main() { // 我们的“路由总管”，负责管理所有的URL和对应的处理函数 let app = Router::new().route(\\u0026#34;/\\u0026#34;, get(root_handler)); // 定义服务器的监听地址，127.0.0.1:3000，很经典，对吧？ let addr = SocketAddr::from(([127, 0, 0, 1], 3000)); println!(\\u0026#34;🚀 服务启动，监听在 {}\\u0026#34;, addr); // 启动服务器，让它开始工作！ axum::Server::bind(\\u0026amp;addr) .serve(app.into_make_service()) .await .unwrap(); } // 这是一个“处理函数”（handler），负责处理发往根路径\\u0026#34;/\\u0026#34;的GET请求 async fn root_handler() -\\u0026gt; \\u0026amp;\\u0026#39;static str { \\u0026#34;你好，来自Axum的世界！🌍\\u0026#34; } 看到没？这就是一个完整的Web服务器了！我们来庖丁解牛一下：\\n#[tokio::main]: 这是一个魔法宏，它把我们的main函数变成了一个异步函数，让它能在Tokio的“宇宙”里运行。 Router::new(): 创建一个路由器实例。你可以把它想象成一个智能交通枢纽，所有进来的网络请求都要先到这里报到。 .route(\\u0026quot;/\\u0026quot;, get(root_handler)): 这就是定义一条交通规则。它告诉路由器：“嘿，如果有人用GET方法访问网站的根目录（/），你就把请求交给root_handler这个家伙去处理。” axum::Server::bind(\\u0026amp;addr).serve(...): 这就是启动服务器引擎，让它在指定的地址和端口上开始监听，随时准备迎接请求。 现在，运行cargo run，你就会看到终端打印出 🚀 服务启动，监听在 127.0.0.1:3000。\\n打开浏览器，访问 http://localhost:3000，你就能看到那句亲切的问候了。\\n感觉怎么样？是不是比想象中简单得多？这只是个开始，真正好玩的还在后头。\\n好的，我们的服务器已经能像个迎宾机器人一样，对每个来访者说一句固定的欢迎词了。但这显然不够“智能”。一个真正的Web服务，需要能听懂人话，能根据不同的指令做出不同的反应。\\n现在，让我们给这个机器人装上耳朵和大脑。\\n第三步：让服务器学会“指名道姓”——玩转路径参数 想象一下，你不想只说“你好”，而是想亲切地喊出访客的名字，比如“你好，张三！”。这就需要服务器能从URL里“抠”出名字来。\\n在Axum里，这简单到令人发指。\\n修改一下你的main.rs，加入一个新的路由和处理函数：\\nuse axum::{ extract::Path, // 👈 新增这个“提取器” routing::get, Router, }; // ... main函数和其他部分保持不变 ... // 在main函数里，给Router加一条新规矩 let app = Router::new() .route(\\u0026#34;/\\u0026#34;, get(root_handler)) // 👇 新增的路由规则 .route(\\u0026#34;/hello/:name\\u0026#34;, get(greet)); // ... main函数结尾部分 ... // 👇 新增的处理函数 async fn greet(Path(name): Path\\u0026lt;String\\u0026gt;) -\\u0026gt; String { format!(\\u0026#34;👋 你好，{}！很高兴认识你。\\u0026#34;, name) } 看重点：\\n/hello/:name: URL里的这个冒号 : 是个占位符，像是在模板上挖了个空。它告诉Axum：“嘿，冒号后面的这部分是动态的，是个变量，名字叫name。” Path(name): Path\\u0026lt;String\\u0026gt;: 这是Axum的“魔法提取器”。它会自动把URL里 :name 位置的字符串（比如 /hello/张三 里的“张三”）提取出来，并且转换成一个String类型，放进name这个变量里。 这就是类型安全的魅力！你根本不用去操心类型转换或者参数是否存在，Axum在编译阶段就帮你搞定了一切。如果URL不匹配，它根本就不会调用这个函数。\\n现在，cargo run重启你的服务。\\n去浏览器访问 http://localhost:3000/hello/梦兽编程 试试看。\\n是不是感觉服务器一下就变得“耳聪目明”了？\\n第四步：处理那些“七嘴八舌”的附加条件——查询参数 路径参数好比是门牌号，是地址的一部分，很固定。但有时候，我们的请求会带一些“附加条件”，比如搜索的时候，你可能会想指定关键词、语言、排序方式等等。\\n这些附加条件，通常就放在URL的问号?后面，我们称之为“查询参数”（Query Parameters）。就像这样：/search?q=rust\\u0026amp;lang=en。\\n这就像你点外卖，地址（路径）是固定的，但你在备注（查询参数）里写上“多放辣，不要香菜”。\\nAxum处理这种“备注”也同样优雅。\\nuse axum::extract::{Query, Path}; // 👈 引入Query提取器 use serde::Deserialize; // 👈 引入serde来帮助解析 // 👇 定义一个结构体，用来接收查询参数 // 这里的`Deserialize`宏是关键，它让这个结构体能从URL参数中创建 #[derive(Deserialize)] struct SearchParams { q: String, // 搜索关键词 lang: Option\\u0026lt;String\\u0026gt;, // 语言，用Option表示这是个可选参数 } // ... 在main函数里，再加一条路由 ... let app = Router::new() // ... 其他路由 ... .route(\\u0026#34;/search\\u0026#34;, get(search)); // 👇 新增的search处理函数 async fn search(Query(params): Query\\u0026lt;SearchParams\\u0026gt;) -\\u0026gt; String { let language = params.lang.unwrap_or_else(|| \\u0026#34;未知\\u0026#34;.to_string()); format!( \\u0026#34;🔍 收到搜索请求！关键词：\\u0026#39;{}\\u0026#39;，语言：\\u0026#39;{}\\u0026#39;\\u0026#34;, params.q, language ) } 这里的“骚操作”是：\\n我们定义了一个SearchParams结构体，它的字段名（q, lang）和URL中的查询参数名完全对应。 Query(params): Query\\u0026lt;SearchParams\\u0026gt;这个提取器，会像一个智能的表格填写机器人，自动把URL里的查询参数填到SearchParams这个结构体的实例中。 我们用了Option\\u0026lt;String\\u0026gt;来处理可选参数lang。如果URL里没有提供lang，它就是None，我们的程序也不会崩溃，优雅地处理了这种情况。 cargo run重启服务，然后访问 http://localhost:3000/search?q=Axum太强了\\u0026amp;lang=中文。\\n再试试不带lang参数的：http://localhost:3000/search?q=Rust无敌。\\n看到没？Axum就像一个训练有素的管家，总能精确地理解你那些“七嘴八舌”的附加要求。\\n第五步：现代API的通用语——优雅地处理JSON 好了，前面都是开胃小菜。在现代Web开发中，我们打交道最多的，其实是JSON。前端发来一个JSON，后端返回一个JSON，这已经成了标配。\\n这就像去一家高级餐厅，你（客户端）给服务员一张写着菜名的点菜单（JSON请求），厨师（服务器）做好菜后，给你端上一盘色香味俱全的菜肴（JSON响应）。\\nAxum处理JSON，简直就是艺术。这得益于Rust生态的另一个大神器：serde。\\nuse axum::{extract::{Query, Path, Json}, response::IntoResponse}; // 👈 引入Json和IntoResponse use serde::{Deserialize, Serialize}; // 👈 引入Serialize和Deserialize // 👇 定义输入结构体（客户端发来的点菜单） // `Deserialize`让它能从JSON字符串变成Rust结构体 #[derive(Deserialize)] struct CreateUser { username: String, email: String, } // 👇 定义输出结构体（我们返回给客户端的菜肴） // `Serialize`让它能从Rust结构体变成JSON字符串 #[derive(Serialize)] struct User { id: u64, username: String, email: String, } // ... 在main函数里，添加一个处理POST请求的路由 ... let app = Router::new() // ... 其他路由 ... .route(\\u0026#34;/users\\u0026#34;, post(create_user)); // 👈 注意这里是post() // 👇 新增的create_user处理函数 async fn create_user(Json(payload): Json\\u0026lt;CreateUser\\u0026gt;) -\\u0026gt; impl IntoResponse { // 这里的Json(payload)提取器，直接把请求体里的JSON解析成了CreateUser结构体 // 是不是很神奇？ // 实际上，这里你会把用户信息存入数据库，然后生成一个ID // 我们这里为了演示，就随便给一个ID let user = User { id: 1337, username: payload.username, email: payload.email, }; // 把user这个结构体包装成Json格式返回 // Axum会自动设置HTTP头 Content-Type: application/json (axum::http::StatusCode::CREATED, Json(user)) } 这段代码的精华在于：\\n#[derive(Deserialize, Serialize)]: 这两个宏是serde库提供的“魔法棒”。一点，你的结构体就立刻获得了“序列化”（变身JSON）和“反序列化”（从JSON变回来）的超能力。 Json(payload): Json\\u0026lt;CreateUser\\u0026gt;: 这个提取器负责把HTTP请求体（Request Body）里的JSON数据，直接转换成一个CreateUser实例。你完全不用手动解析字符串，告别了在其他语言里可能遇到的JSON.parse()和各种繁琐的验证。 -\\u0026gt; impl IntoResponse: 这表示我们的函数会返回一个可以被转换成HTTP响应的东西。 (StatusCode::CREATED, Json(user)): 我们不仅返回了Json(user)作为响应体，还顺便指定了HTTP状态码为201 CREATED，非常符合RESTful规范。Axum会自动帮你把user这个Rust对象转换成JSON字符串，并设置好正确的Content-Type头。 因为浏览器不方便发送POST请求，你需要用curl或者Postman这样的工具来测试它。打开你的终端，试试这个命令：\\ncurl -X POST \\\\ http://localhost:3000/users \\\\ -H \\u0026#39;Content-Type: application/json\\u0026#39; \\\\ -d \\u0026#39;{ \\u0026#34;username\\u0026#34;: \\u0026#34;梦兽编程\\u0026#34;, \\u0026#34;email\\u0026#34;: \\u0026#34;ai@example.com\\u0026#34; }\\u0026#39; 你会收到一个漂亮的JSON响应，告诉你用户已创建成功。\\n至此，我们的服务器已经从一个只会说“你好”的机器人，进化成了一个能听懂指令、会填表、还能按订单做菜的五星大厨了。\\n但一个真正的生产级应用，还需要处理共享状态（比如数据库连接池）、日志、认证等更复杂的问题。这就要请出Axum的另外两个大杀器：State和Middleware。\\n准备好了吗？下一章，我们将进入更深层的领域，探索如何让我们的“乐高”服务器拥有记忆和保安。\\n我们已经打造了一个聪明的“厨师”，他能看懂菜单（路径参数）、听懂备注（查询参数）、还能烹饪标准的JSON大餐。\\n但现在，我们的餐厅有一个致命问题：厨师没有记忆。\\n他不知道今天来了多少客人，也不知道哪些是VIP客户。每个订单对他来说都是全新的，做完就忘。而且，餐厅门口连个迎宾和保安都没有，谁都能随便进。\\n这可不行。一家高级餐厅，必须有记忆（共享状态）和流程（中间件）。\\n第六步：给服务器一颗“大脑”——共享状态的艺术 在Web开发中，“状态”是个核心概念。它可以是数据库连接池、应用的配置信息，或者一个简单的网站访问计数器。它需要在不同的请求之间共享和维护。\\n在Axum中，我们要实现这个，需要请出两个Rust并发编程的“守护神”：Arc和Mutex。\\n别怕，这两个词看着吓人，我用一个比喻你就懂了。\\n想象一下，我们餐厅的厨房中央，有一本**《今日客流量》**的记事本，所有厨师（请求处理线程）都需要在上面登记。\\nMutex (互斥锁): 这就是给这本记事本配的一把锁和一把钥匙。为了防止两个厨师同时在上面写字导致内容混乱，规定同一时间只能有一个厨师拿到钥匙，打开本子写字。写完后，必须把钥匙还回来，下一个厨师才能用。这个过程就叫“加锁”和“解锁”。\\nArc (原子引用计数): 现在问题来了，我们有很多厨师，但钥匙只有一把。怎么管理这把钥匙的“所有权”呢？Arc就像一个高度智能的钥匙管理员。它会复制出很多“凭证”，安全地分发给每个需要用钥匙的厨师。它内部会默默地记着“我发了多少凭证出去”。当一个厨师用完钥匙，他的凭证就作废了。当所有凭证都作废后，Arc就知道这把钥匙没用了，可以安全地销毁了。\\nArc\\u0026lt;Mutex\\u0026lt;T\\u0026gt;\\u0026gt; 这个组合，就是Rust里实现线程安全共享数据的“黄金搭档”。它保证了数据在多线程环境下既能被共享，又不会被同时修改而出错。\\n好了，理论课结束，上代码！我们要实现一个简单的“访问计数器”。\\nuse axum::{ extract::Extension, // 👈 注意，这里我们用Extension层来注入状态 routing::get, Router, }; use std::sync::{Arc, Mutex}; // 👈 引入我们的两位“守护神” // 定义一个类型别名，让代码更清晰 // 这就是我们的“带锁的、可被多线程共享的计数器” type SharedState = Arc\\u0026lt;Mutex\\u0026lt;u32\\u0026gt;\\u0026gt;; #[tokio::main] async fn main() { // 👇 初始化我们的共享状态 // 创建一个被Arc和Mutex包裹的计数器，初始值为0 let shared_state = SharedState::new(Mutex::new(0)); let app = Router::new() .route(\\u0026#34;/\\u0026#34;, get(root_handler)) // 👇 新增一个路由，用来显示和增加计数 .route(\\u0026#34;/hits\\u0026#34;, get(hit_counter)) // 👇 这是关键！使用.layer()方法，把我们的共享状态“注入”到应用中 // 现在，所有处理函数都能从这一层里拿到状态了 .layer(Extension(shared_state)); // ... 启动服务器的代码不变 ... } // ... root_handler 不变 ... // 👇 新增的计数器处理函数 async fn hit_counter(Extension(state): Extension\\u0026lt;SharedState\\u0026gt;) -\\u0026gt; String { // 1. 从Extension中拿到我们的共享状态 // 2. .lock() - 厨师拿到了记事本的钥匙 // 3. .unwrap() - 打开了锁（这里我们假设锁总能打开） let mut count = state.lock().unwrap(); // 4. *count += 1 - 在记事本上把数字加1 *count += 1; // 5. 返回一句话，把当前的客流量告诉访客 format!(\\u0026#34;你是第 {} 位访客！感谢光临！\\u0026#34;, count) // 当函数结束时，`count`这个变量被销毁，锁会自动释放，钥匙就还回去了 } 现在，cargo run重启服务。\\n你第一次访问 http://localhost:3000/hits，会看到“你是第 1 位访客！”。 刷新一下，就变成了“你是第 2 位访客！”。 再打开一个无痕窗口访问，计数会继续增加到3。\\n看到了吗？我们的服务器拥有了记忆！它不再是那个健忘的厨师了。通过Extension层，我们像安装了一个“中央数据架”，任何一个处理流程都能按需取用。\\n第七步：建立“安检通道”——无所不能的中间件 中间件（Middleware）是现代Web框架的精髓。它像一个可插拔的安检通道，所有进入餐厅的请求，都必须先经过它。\\n你可以在这个通道里做任何事：\\n记录日志：每个请求进来，先记下一笔：什么时间，访问了哪个URL。 身份验证：检查请求是否带有合法的“会员卡”（Token），没有就直接拦下。 数据压缩：把返回给客户端的内容打包一下，节省流量。 CORS处理：处理跨域请求，决定是否要接待来自“隔壁商业街”的客人。 Axum的中间件系统构建在tower这个强大的库之上，生态非常丰富。我们来加一个最常用的——日志中间件。\\n首先，你需要添加一个新的依赖：\\ncargo add tower-http --features \\u0026#34;trace\\u0026#34; 然后，在代码里把它“安装”到我们的应用上：\\nuse tower_http::trace::TraceLayer; // 👈 引入日志层 use axum::{Extension, Router, routing::get}; // ...其他use语句... #[tokio::main] async fn main() { let shared_state = /* ... */; let app = Router::new() .route(\\u0026#34;/\\u0026#34;, get(root_handler)) .route(\\u0026#34;/hits\\u0026#34;, get(hit_counter)) .layer(Extension(shared_state)) // 👇 在所有路由定义之后，再加一个全局的日志层 .layer(TraceLayer::new_for_http()); // 👈 就是这一行！ // ... 启动服务器 ... } // ... 其他处理函数 ... 就这么简单！只需要一行.layer(TraceLayer::new_for_http())，我们的服务器就拥有了完整的HTTP请求日志功能。\\n现在cargo run，然后随便访问几个你之前创建的URL，比如/、/hits、/hello/somebody。\\n再回头看看你的终端，你会发现它打印出了类似这样的详细日志：\\nINFO tower_http::trace::on_request: started processing request ... INFO tower_http::trace::on_response: finished processing request latency=... 每一条请求的进入、处理完成、耗时、状态码，都一目了然。这对于调试和监控来说，简直是神器！\\n创造者，主菜已上。\\n我们的服务器现在不仅有大脑（State），还有了保安和迎宾（Middleware）。它已经是一个功能完备、结构清晰、高性能的Web应用雏形。\\n第八步：终极挑战——你的“毕业设计”时间！ 理论说了这么多，是时候亲手下厨，做一顿完整的“四菜一汤”了。\\n这是一个小小的挑战，但它包含了我们前面学到的所有核心知识。把它完成，你就可以自豪地宣布：“我，已经掌握了Axum的精髓！”\\n你的任务是，搭建一个具备以下功能的小服务器：\\n人气计数器 (/count): 创建一个GET路由，它使用我们学过的Arc\\u0026lt;Mutex\\u0026lt;T\\u0026gt;\\u0026gt;共享状态，每次被访问时，计数器加一，并返回“本站总访问量：X次”。 回声机器人 (/echo?text=...): 创建一个GET路由，它能接收一个名为text的查询参数，然后原封不动地返回这个text的内容。比如访问/echo?text=hello，就返回hello。 VIP接待API (/api/greet): 创建一个POST路由，它能接收一个JSON请求体，格式为{\\u0026quot;name\\u0026quot;: \\u0026quot;某个名字\\u0026quot;}。然后返回一个JSON响应，格式为{\\u0026quot;message\\u0026quot;: \\u0026quot;尊贵的VIP，某个名字，欢迎您的到来！\\u0026quot;}。 迎宾日志系统: 为你的整个应用添加TraceLayer中间件，确保每一次请求都会在控制台留下记录。 (附加题) 国际友人通道: 了解一下tower-http里的CorsLayer，尝试给你的应用加上CORS（跨域资源共享）支持，让来自任何源的请求都能访问你的API。 别怕，这就像把你刚刚学会的乐高积木块拼在一起。把前面的代码翻出来看看，你会发现你已经拥有了所有的“零件”。\\n完成它，你就是一名合格的Axum建筑师了！\\n武功秘籍小抄：Axum知识点浓缩胶囊 怕忘？别担心，我把所有精华都给你浓缩到一张小卡片上了。把它揣进兜里，随时拿出来看看。\\n特性 它的作用（大白话版） Router::new() 创建你的“路由总指挥官” .route() 给总指挥官下达“交通规则” Path\\u0026lt;T\\u0026gt; 从URL路径里“抠出”动态的名字 Query\\u0026lt;T\\u0026gt; 解析URL问号后面的各种“备注信息” Json\\u0026lt;T\\u0026gt; 优雅地处理JSON“点菜单”和“成品菜” Extension\\u0026lt;T\\u0026gt; 为应用注入全局共享的“中央大脑” Middleware / .layer() 安装可插拔的“安检通道”（日志、认证等） 写在最后：这不只是一个框架，这是一张通往未来的门票 从一行cargo add axum开始，到现在，你已经亲手搭建了一个拥有大脑、记忆和安保系统的高性能Web服务器。\\n回想一下整个过程。\\n你没有看到Spring那样山峦般沉重的配置和注解，也没有遇到Node.js在处理CPU密集型任务时的无奈。\\n你体会到的是一种前所未有的掌控感：性能和安全，由编译器在起跑线上就为你保驾护航；优雅和简洁，由Axum的声明式API为你完美呈现。你写的每一行代码，都清晰、直接、且高效。\\n掌握Axum，你掌握的不仅仅是一个工具，而是一种全新的后端开发哲学——用最少的资源，做最快的事，写最稳的代码。\\n这，就是Rust和它优秀的生态带给我们的底气。在这个性能和效率越来越重要的时代，这不仅仅是一项新技能，更是你技术军火库里的一件大杀器。\\n别再犹豫了，这头性能猛兽，一旦驾驭，旦用难回。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tutorials/rust/axum-from-zero-to-hero-tutorial/\",\n    \"date\": \"2025-08-14\",\n    \"section\": \"tutorials\",\n    \"tags\": [\"Rust\",\"Axum\",\"Tokio\",\"Web\",\"Backend\",\"REST\",\"Middleware\"],\n    \"categories\": [\"Rust\",\"后端开发\",\"教程\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Rust 的 unsafe 不是“随便玩玩”，而是生死状：6 个让你代码原地爆炸的骚操作\",\n    \"description\": \"别把 unsafe 当成免死金牌！本文以实战示例拆解 6 个最常见的 unsafe 误用场景：把它当胶带封编译器嘴、乱解引用裸指针、在 unsafe 里违反借用检查、重复造轮子、滥用 unsafe impl 以及缺少 Safety 注释，让你建立正确的风险意识与使用范式。\",\n    \"content\": \"朋友，你是否也经历过这样的深夜？\\n显示器上，Rust编译器那鲜红的错误提示，像一双无情的大手，死死扼住你项目的喉咙。生命周期、所有权、借用检查……这些平时让你引以为傲的安全卫士，此刻却像一群喋喋不休的唐僧，念得你头皮发麻，只想大喊一声：“闭嘴！”\\n就在你万念俱灰，准备砸键盘的前一秒，一个词在你脑海中闪着金光，带着魔鬼的诱惑——unsafe。\\n它看起来那么美，像一个“作弊码”，一个能让所有红线瞬间消失的“上帝模式”开关。你颤抖着敲下这六个字母，把它像一个神圣的结界一样包裹住你那段“问题”代码。\\ncargo build\\u0026hellip; 成功了！世界清净了。\\n你长舒一口气，感觉自己像个驯服了恶龙的英雄。但你没看到的是，编译器在沉默的背后，留下了一个轻蔑的眼神，仿佛在说：“好吧，你非要这么玩，那接下来出的所有事，你自己扛。”\\nunsafe：不是免死金牌，而是你签下的“生死状” 让我们先撕掉unsafe那层“自由奔放”的伪装，直面它残酷的真相。\\n在Rust的世界里，unsafe关键字并不意味着“关闭所有安全检查，大家一起YOLO”。它的真正含义是：\\n“我，这位牛逼的程序员，在此郑重立誓，我将亲自接管这块代码的内存安全。编译器你看不懂的，我懂；你检查不到的，我来保证。如果程序崩溃、内存泄漏、数据错乱，甚至导致服务器爆炸、公司倒闭，都是我一个人的责任。”\\n看明白了吗？你不是在关闭规则，你是在跟编译器签一份“生死状”。你把胸脯拍得邦邦响，告诉它：“这块地盘我罩着，出事我负责！”\\n这就像你开着一辆有全球最顶级自动驾驶系统的汽车。但你嫌它太啰嗦，总在你快要撞墙时自动刹车。于是你手动关掉了所有安全辅助，一脚油门踩到底，笑着说：“还是手动挡开着爽！”\\n爽是爽了，但前方是悬崖还是坦途，就全看你自己的技术和运气了。\\n大多数时候，我们以为自己是藤原拓海，实际上我们只是刚拿驾照的愣头青。为了避免大家在“秋名山”上翻车，今天，我就带你盘点一下那些开发者最爱犯的unsafe“作-死-骚-操-作”。\\n第一宗罪：把unsafe当胶带，封住编译器的嘴 这是最常见，也是最愚蠢的错误。当你搞不定生命周期或者所有权问题时，第一反应不是去理解它，而是简单粗暴地用unsafe块包起来，让编译器“闭嘴”。\\n犯罪现场复现：\\nlet r: \\u0026amp;i32; unsafe { r = std::mem::transmute(0x123456usize); } println!(\\u0026#34;{r}\\u0026#34;); 这段代码，你用unsafe强行把一个不知所谓的内存地址 0x123456 “翻译”成了一个 i32 的引用。编译器被你用unsafe捂住了嘴，只能眼睁睁地看着你作死。\\n后果： 编译通过，运行崩溃。或者更糟的，它没崩溃，但在某个不为人知的角落，数据已经开始腐烂，直到你的客户在半夜三点打电话投诉，你都不知道问题出在哪。\\n梦兽箴言： 编译器对你发出的每一个警告，都像是你妈觉得你冷。她可能不懂时尚，但她绝不会害你。当你试图用unsafe让它闭嘴时，先问问自己：我是不是真的比这个设计了四十多年、凝聚了无数智慧的编译器系统更懂安全？\\n我们刚刚揭露了unsafe的第一宗罪，但这仅仅是打开了潘多拉魔盒的一条缝。现在，让我们深入黑暗，看看那些更隐蔽、更致命的骚操作。\\n第二宗罪：手持“万能钥匙”，却在开“盲盒” 裸指针（Raw Pointers）是unsafe世界里的常客。它就像一把钥匙，可以指向内存里的任何地方。而有些新手，拿到这把钥匙后，就兴奋地像个拿到了万能钥匙的小偷，随便找个“门牌号”（内存地址）就想开门看看。\\n犯罪现场复现：\\nlet ptr = 0x123456usize as *const i32; unsafe { println!(\\u0026#34;{}\\u0026#34;, *ptr); // 哥们，你猜这里面是啥？ } 你给了ptr一个固定的内存地址，然后自信地用 * 来解引用，想看看里面藏着什么宝贝。\\n后果： 这不是在寻宝，这是在玩俄罗斯轮盘。那个地址上可能空无一物，可能是你操作系统的核心数据，也可能是隔壁程序存放的商业机密。你这一“开”，轻则程序当场去世，重则引发系统蓝屏，甚至可能因为修改了不该改的数据，导致一些无法预测的、幽灵般的bug。\\n梦兽箴言： unsafe给了你开锁的权利，但前提是你必须百分之百确定这把钥匙对应的是你自己的保险箱，而不是别人的军火库。正确的做法是什么？只解引用那些你亲手创建、知根知底的指针。\\n正确的“开锁”姿势：\\nlet x = 42; // 从一个已知的、安全的变量x创建指针 let ptr = \\u0026amp;x as *const i32; unsafe { // SAFETY: 我们非常确定ptr指向的是x，而x活得好好的。 println!(\\u0026#34;safe ptr: {}\\u0026#34;, *ptr); // 输出: 42 } 记住，在unsafe的世界里，好奇心害死的不是猫，是你的程序。\\n第三宗罪：拿到“免罪金牌”，就以为能为所欲为 很多开发者有个天真的误解：一旦进入了unsafe代码块，就仿佛进入了一个法外之地，所有的Rust规则都失效了，可以为所欲为。\\n朋友，你想多了。unsafe块更像是你拿到了一张“外交豁免”牌，它能让你在“解引用裸指针”这类特定事情上不受追究，但如果你敢在光天化日之下违反“借用检查”这种根本大法，Rust的警察叔叔照样会把你按在地上摩擦。\\n犯罪现场复现：\\nunsafe { let mut v = vec![1, 2, 3]; // 我先借个“只读”的身份证看看 let x = \\u0026amp;v[0]; // 然后我突然想改一下户口本 v.push(4); // 警察叔叔：站住！不许动！ println!(\\u0026#34;{x}\\u0026#34;); } 这段代码，即便被unsafe包裹，也根本无法通过编译！为什么？因为你同时拥有了一个不可变借用（x）和一个可变借用（v.push(4)）。这是Rust所有权体系的绝对禁忌，是不可触碰的红线。\\n梦兽箴言： unsafe不是让你无视所有法律，它只是给了你5个“特权”，让你可以在刀尖上跳舞：\\n解引用裸指针 调用unsafe函数或外部函数（FFI） 访问或修改可变的静态变量 访问union的字段 实现unsafe的trait 除了这五件事，在unsafe块里，你依然是Rust的好公民，必须遵守借用检查、所有权等所有其他规则。别以为拿了“免罪金牌”就能横着走，它只在特定场景下生效。\\n感觉怎么样？是不是开始对unsafe有了“敬畏之心”？别急，我们还没讲完。后面还有更高级的作死技巧，比如“自己动手造核弹（而不是用现成的）”、“随便给东西贴‘免检’标签”等等。\\n我们已经见识了新手最容易犯的三个错误。现在，让我们进入更深邃、更危险的领域。接下来的骚操作，每一个都可能在大型项目中埋下足以致命的暗雷。\\n第四宗罪：重复造轮子，还是方的 当你需要和C语言库打交道，或者处理一些底层字符串时，你可能会想：“不就是算个字符串长度嘛，我用unsafe自己写一个，多酷！” 于是，你大笔一挥，写出了这样的“杰作”：\\n犯罪现场复现：\\n// 手动实现一个C风格的strlen函数 unsafe fn strlen(ptr: *const u8) -\\u0026gt; usize { let mut len = 0; while *ptr.add(len) != 0 { len += 1; } len } 看起来是不是特别有“黑客范”？你用指针运算，逐个字节地检查，直到遇到那个代表字符串结尾的 \\\\0。你觉得自己简直就是个底层系统大师。\\n但现实是，你很可能在重复造一个效率更低、更容易出错、而且是方形的轮子。\\n梦兽箴言： 在动手写任何unsafe代码之前，请先默念三遍：“我是不是在重新发明轮子？” Rust的生态和标准库极其强大，几乎所有常见的底层操作，都有人帮你封装好了安全、高效的“轮子”。\\n正确的“拿来主义”姿势：\\nuse std::ffi::CStr; fn main() { let c_string_bytes = b\\u0026#34;hello\\\\0\\u0026#34;; // 注意这个结尾的\\\\0 let c_str_ptr = c_string_bytes.as_ptr() as *const i8; let cstr = unsafe { // SAFETY: 我们保证了指针来源可靠，且内容是以\\\\0结尾的有效C字符串。 CStr::from_ptr(c_str_ptr) }; println!(\\u0026#34;用现成的轮子，真香: {:?}\\u0026#34;, cstr); } std::ffi::CStr 已经帮你处理了所有脏活累活，并且提供了安全的接口。你只需要在一个极小的unsafe块里保证你传入的指针是合法的，剩下的交给它就好。这才是专业的做法。不要用战术上的勤奋，去掩盖战略上的懒惰。\\n第五宗罪：我是“质检员”，我说了算 这是unsafe领域里最高危、也最容易被滥用的特性之一：unsafe impl。\\n当你写下 unsafe impl Send for MyType {} 时，你不是在写代码，你是在对天发誓。你是在告诉整个Rust并发系统：“我发誓，我这个MyType类型，可以被安全地在线程之间传来传去，绝对不会出数据竞争问题！”\\n编译器会完全相信你的誓言，不再对它进行任何检查。\\n犯罪现场复：\\n// MyType里可能包含了一些不适合跨线程操作的东西，比如裸指针 struct MyType { ptr: *mut i32, } // 你大笔一挥，强行说它是线程安全的 unsafe impl Send for MyType {} // 轰隆！ 后果： 这是在给你的并发代码埋下一颗定时核弹。平时单线程跑得好好的，一旦在高并发场景下，两个线程同时操作了MyType实例里的同一个裸指针，数据竞争、内存损坏、程序崩溃……各种灵异事件将接踵而至，而且你根本不知道从何查起。\\n梦兽箴言： unsafe impl Send 和 unsafe impl Sync 是unsafe世界里的“核武器按钮”。除非你正在编写极其底层的并发原语，并且你对内存模型、原子操作、线程安全的理解已经到了专家级别，否则，永远，永远不要碰它！\\n对于99.99%的场景，Rust提供的Arc\\u0026lt;Mutex\\u0026lt;T\\u0026gt;\\u0026gt;这类安全并发工具，已经足够你用了。\\n#[derive(Clone)] struct MyType { data: Arc\\u0026lt;Mutex\\u0026lt;Vec\\u0026lt;u8\\u0026gt;\\u0026gt;\\u0026gt;, } 第六宗罪：写“天书”，让未来的自己追杀你 最后一个，也是最考验人品的问题：不写注释。\\nunsafe代码本身就难以理解，因为它打破了常规的思维模型。如果你写了一段精妙绝伦（或者说阴险狡诈）的unsafe代码，却没有留下任何注释……\\n犯罪现场复现：\\nunsafe { // some pointer hackery // ...一段让人眼花缭乱的指针操作... } 后果： 三个月后，当你或者你的同事回来维护这段代码时，你们会看着这块“天书”面面相觑，内心充满无数个“卧槽”。没人敢动它，没人知道它为什么要这么写，它依赖了哪些外部条件才能保证安全。这块代码就成了一个不可维护的“黑洞”。\\n正确的“传世”姿势：\\nlet mut data = [1, 2, 3]; let ptr1 = data.as_mut_ptr(); let ptr2 = unsafe { ptr1.add(2) }; unsafe { // SAFETY: 我们通过as_mut_ptr获取了数组的起始指针ptr1。 // 我们知道数组长度是3，所以ptr1.add(2)得到的ptr2 // 依然在数组的边界之内，不会越界。 // 因此，解引用ptr2是安全的。 *ptr2 = 4; } assert_eq!(data, [1, 2, 4]); 每一段unsafe代码，都必须配上一段被称为“Safety Comment”（安全注释）的文字。在这段注释里，你必须像写合同一样，清晰地解释：\\n为什么这段代码必须是unsafe的？ 你做了什么来保证它的安全性？ （比如，你如何确保指针是有效的？你如何避免数据竞争？） 调用者需要遵守哪些“契约”才能保证不出问题？ 这不仅是写给别人看的，更是写给未来的自己看的。\\n总结：手握屠龙之技，常怀敬畏之心 unsafe是Rust赋予我们的终极力量，它让我们能与底层硬件共舞，能与C/C++生态无缝连接，能榨干系统的最后一滴性能。它是一把削铁如泥的“屠龙刀”。\\n但请记住，一个不负责任的屠龙者，造成的破坏比恶龙本身更可怕。\\n用unsafe时，请始终保持谦卑和敬畏：\\n优先选择安全代码。 把unsafe块限制在最小范围。 用安全的抽象把它包裹起来。 为你写的每一个unsafe块，立下清晰的“生死状”（安全注释）。 只有这样，你才能真正驾驭这股力量，成为一名真正的Rust大师，而不是一个随时可能“删库跑路”的莽夫。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tutorials/rust/rust-unsafe-yolo-sao-cao-zuo/\",\n    \"date\": \"2025-08-13\",\n    \"section\": \"tutorials\",\n    \"tags\": [\"Rust\",\"unsafe\",\"内存安全\",\"指针\",\"FFI\",\"并发\",\"最佳实践\"],\n    \"categories\": [\"tutorials\",\"rust\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"2025 独立开发者“穷鬼套餐”：AI 编程省钱秘笈与 0 成本 Web 部署（含 DeepSeek R1 0528、Gemini 2.5、Qwen3 热点）\",\n    \"description\": \"2025 热点：DeepSeek R1 0528、Gemini 2.5、Qwen3 等免费/低成本 AI 编程组合 + Vercel/Cloudflare Pages/Workers 等 0 成本 Web 部署完整攻略，独立开发者“穷鬼套餐”实战指南。\",\n    \"content\": \"2025 独立开发者“穷鬼套餐”：AI 编程省钱秘笈与 0 成本 Web 部署 你有没有过这种感觉——想用 AI 编程，但一看到价格就头皮发麻？（更新至 2025-08，覆盖 DeepSeek R1 0528、Gemini 2.5、Qwen3 等热门模型） 别慌，今天我就带你走一遍“穷鬼套餐”流程，免费吃到饱，照样写出高质量代码。\\n免费 AI 模型自助餐 —— 用浏览器就能开整 第一步，咱们先来个“大胃王挑战”。思路很简单：多开几个浏览器标签，把能白嫖的 AI 都拉上来。 为什么要这样？——不同平台的 AI 各有长短，组合起来就像组建一个超级英雄联盟。\\n这里是我亲测好用的免费 AI 列表：\\nz.ai 免费体验 GLM 4.5，性能不输 Claude 4，尤其擅长编程和逻辑推理。适合写函数、调试、做算法优化。 优点：速度快、代码质量高 缺点：偶尔会卡几秒，但白嫖还挑啥呢\\nKimi.com Kimi K2 模型，风格和 Claude 很像，适合写长文档、做系统设计，甚至可以帮你生成完整的 API 说明。 优点：上下文记忆不错 缺点：偶尔会“话痨”\\nchat.qwen.ai 阿里出品的 Qwen3 Coder，代码能力很稳，尤其在中文编程场景下表现优异。 优点：编程指令执行力强 缺点：界面偏简单\\nOpenAI Playground 只要你同意共享数据给 OpenAI，就能拿到大额免费 Token，玩 GPT-4.1/5 都行。 优点：调试灵活，参数可控 缺点：要有一定英文基础\\nGoogle AI Studio Gemini 2.5 Pro/Flash 免费不限量，Pro 在项目规划和调试上简直是神器，还内置 Build apps with Gemini，特别适合写 React/TypeScript 初始化项目。 优点：适合产品原型和复杂系统思路梳理 缺点：有时对国内网络不太友好\\nPoe.com 每天送积分，可以用高级模型如 Claude 4、GPT-5。 优点：支持多个模型切换 缺点：免费额度有限\\nOpenRouter 集成多家 AI 模型，有一些免费额度。 优点：一站式试用多个模型 缺点：要自己过滤哪些是免费的\\nChatGPT 免费版 现在偶尔也能用到 GPT-5，虽然量少，但聊聊小问题够用了。\\nMicrosoft Copilot 直接在 Edge 浏览器用 GPT-5，做代码解释、网页信息提炼都很方便。\\nGitHub Copilot 对程序员超友好，提供 GPT-4.1/4o，以及少量高级模型额度（如 GPT-5、Claude 3.7/4）。\\nPerplexity AI 强项是研究型问题搜索，适合快速获取资料和代码示例。\\nDeepseek 免费 v3 和 r1 版本，尤其是 DeepSeek R1 0528 推理能力超强，适合做复杂逻辑代码。\\nGrok.com 特点是“没那么多限制”，适合做一些不被其他平台允许的深度测试。\\nPhind 对程序员很友好，支持流程图、可视化图表的生成。\\nlmarena.ai 像一个“AI 竞技场”，能试用 GPT-5、Claude Opus 4、Sonnet 4 等大模型。\\nClaude.ai 免费可用，但流量高峰期可能会限用。\\n用 AI 编程代理工具提升性价比 直接网页聊 AI 虽然方便，但如果是写代码，AI 编程代理工具会更好用，因为它们更会记上下文，还能调工具。 常见的有 Cline、Cursor、Trae、Copilot 等。\\n一个小技巧： AI 输入越短，它越聪明。 别给它一堆无关信息，不然就像你让朋友帮忙找个餐馆，却先讲了半小时你童年的故事——浪费时间，还可能跑题。\\n这里顺便列几个“长记忆”怪兽（2025 年 8 月数据）：\\nGemini 2.5 Pro（Google）：上下文窗口 100 万 Token，适合做超复杂的架构设计 Qwen3（阿里云）：原生 256k，扩展到 100 万 Token，性价比高，中文编程能力顶尖 Web 部署的穷鬼攻略：不花钱也能让网站上线 你写完代码，肯定想立刻上线给全世界看看。问题是——云服务器太贵，动不动就一百多一个月，独立开发者根本顶不住。 别担心，这里有三套“穷鬼”级方案，帮你 0 成本甚至负成本 把项目丢上网。\\n方案一：薅云平台的羊毛（免费额度吃到饱） 各大云平台为了拉新，都有免费试用额度。只要你懂得轮着用，就能长期白嫖。\\n推荐薅的云服务商：\\nVercel 前端部署神器，绑定 GitHub 一推代码就自动上线，适合静态站、Next.js 项目。 优点：简单、免服务器管理 缺点：动态后端要配其他服务\\nNetlify 类似 Vercel，也适合前端和无服务器函数。 优点：CI/CD 顺滑 缺点：免费额度有限\\nRender 不仅能部署前端，还能跑 Node.js、Python 后端。 优点：功能全，部署容易 缺点：睡眠机制（免费应用长时间不用会休眠）\\nRailway 新手友好，免费送额度，可跑数据库和后端。 优点：一键启动模板多 缺点：超额后价格偏高\\nFly.io 全球分布部署，能把应用跑在离用户最近的地方。 优点：延迟低 缺点：需要写 Dockerfile\\n小提示：多注册几个邮箱，多薅几轮，基本能免费用一年以上。\\n方案二：完全依赖 Cloudflare（零成本 + CDN 加速） Cloudflare 不只是个 CDN，它的 Pages 和 Workers 可以帮你免费托管网站，甚至做后端 API。\\nCloudflare Pages：适合静态网站，直接从 GitHub 拉代码，部署速度飞快。 Cloudflare Workers：可以写 JavaScript/TypeScript 后端，延迟低，还自带全球 CDN。 Cloudflare KV / D1 数据库：适合轻量数据存储，完全免费额度足够个人项目用。 优点：\\n全球节点加速，访问飞快 不用管服务器运维 缺点： 不适合高计算量的任务（比如视频转码） 方案三：自托管 + 白嫖硬件 如果你有一台闲置的旧笔记本、NAS，甚至一台树莓派，那就可以玩自托管。 用 Docker + Nginx，一样可以跑网站。 加上 Tailscale 这种内网穿透工具，哪怕家里是普通宽带，也能让全世界访问你的项目。\\n常用工具：\\nDocker：一键打包环境，部署无痛迁移 Nginx：反向代理 + 静态资源服务 Tailscale / Cloudflare Tunnel：让你的本地机器能被外网访问 优点：\\n成本几乎为零（电费算你的） 自由度高，想装啥就装啥 缺点： 自己要维护服务器稳定性 📌 实战建议： 很多独立开发者会混搭这三种方案，比如：前端放 Vercel，后端跑在 Cloudflare Workers，数据库用 Railway，这样成本=0，还能全球加速。\\n🚀 总结：穷鬼也能玩转 AI 编程 + Web 部署 说到底，独立开发者要想“低成本高产出”，核心思路就是：\\n白嫖一切能白嫖的 AI 模型——不同平台互补长短，用浏览器标签页做 AI 联盟。 用 AI 编程代理工具提升生产力——短指令 + 高上下文窗口，让模型专注干活。 部署上选零成本方案——薅云平台额度、用 Cloudflare 免费全球加速，或者直接自托管。 这套玩法最大的好处就是：\\n成本接近 0（唯一支出可能是电费） 上线速度快（云服务一键部署） 扩展灵活（前后端、数据库都能自由组合） 我见过不少朋友，靠这套组合拳，不仅自己玩得开心，还能接小外包赚点零花钱。 所以，不差钱的时候可以用高级方案，但没钱的时候，一样能用 AI 做出好项目。\\n关注梦兽编程微信公众号，解锁更多黑科技玩法，让你的编程之路更轻松、更省钱。\\n常见问题（FAQ） Q1：2025 年有哪些免费的（或接近免费的）顶尖 AI 模型可用于编程？\\nDeepSeek R1 0528、Gemini 2.5（Pro/Flash）、Qwen3 Coder、Kimi K2、GLM 4.5、Copilot 的 GPT-4.1/4o 配额等都值得组合使用，能覆盖从算法实现到系统设计的全场景需求。\\nQ2：如何 0 成本把前端和后端都上线？\\n前端放 Vercel/Netlify/Cloudflare Pages，后端用 Cloudflare Workers 或 Render/Railway 的免费配额，轻量数据用 Cloudflare KV/D1 即可。\\nQ3：DeepSeek R1 0528 是否适合复杂代码推理？\\n是的。R1 0528 在链式推理与长上下文任务上表现突出，适合作为复杂业务逻辑、算法调优与代码审查的“副驾驶”。\\n\",\n    \"permalink\": \"https://rexai.top/tools/ai-tools/ai-programming-web-deploy-free-guide-2025/\",\n    \"date\": \"2025-08-12\",\n    \"section\": \"tools\",\n    \"tags\": [\"AI 编程\",\"免费 AI\",\"DeepSeek R1\",\"Gemini 2.5\",\"Qwen3\",\"Web 部署\",\"Cloudflare Pages\",\"Vercel 免费\",\"独立开发者\",\"穷鬼套餐\",\"0 成本部署\",2025],\n    \"categories\": [\"AI 工具\",\"编程生产力\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"别再把 tokio::spawn 当线程了！我用它2秒启动1000个任务，系统竟然毫无压力\",\n    \"description\": \"tokio::spawn 并不是线程，而是轻量任务。在 Tokio 的调度下通过 sleep、timeout 和 select 构建高并发服务：2 秒内轻松调度 1000 个任务而系统毫无压力。\",\n    \"content\": \"关注梦兽编程微信公众号，轻松入门Rust\\n朋友，先忘掉你大学操作系统课上学到的那些关于“线程”的沉重知识。因为今天，我要告诉你一个关于 Tokio 的“惊天骗局”。\\n你以为 tokio::spawn 是在帮你创建线程？\\n错了。它在用一种更聪明、更轻量、甚至可以说更“狡猾”的方式，让你拥有了驾驭超高并发的能力，而成本却低到令人发指。这，就是 Rust 在后端领域横扫千军的秘密武器。\\n准备好了吗？让我们一起揭开这个“骗局”的真相。\\n核心骗局：tokio::spawn 不是线程，是“任务卡” 想象一下，你开了一家超火爆的网红餐厅。\\n如果按照传统思维（比如 Java 或 C++ 的某些老派做法），每来一个客人（一个请求），你就得雇一个专属厨师（一个操作系统线程）从头到尾只为他服务。生意冷清时还好，一旦高峰期来了1000个客人，你就得雇1000个厨师。厨房瞬间爆炸，你的薪水单也跟着爆炸。\\n这就是线程的困境：昂贵且数量有限。\\n而 Tokio 就像一个天才餐厅经理。它说：“我只有一个精英厨师团队（一个小的线程池），但我能让厨房同时处理成千上万份订单。”\\n怎么做到的？靠的就是 tokio::spawn。\\n你每 spawn 一个任务，就好比给前台下了一张“任务卡”（比如“切菜”、“炒一份宫保鸡丁”）。这张任务卡被扔进一个叫“异步运行时”的中央调度系统里。\\nuse tokio::task; #[tokio::main] async fn main() { let handle = task::spawn(async { println!(\\u0026#34;👨‍🍳 后台任务：正在疯狂切菜...\\u0026#34;); // 模拟一些计算 \\u0026#34;一盘切好的黄瓜\\u0026#34; }); let result = handle.await.unwrap(); println!(\\u0026#34;✅ 主线程：收到了 -\\u0026gt; {result}\\u0026#34;); } 这个 async 代码块，就是那张“任务卡”。它被 spawn 出去后，并没有立刻霸占一个厨师（线程）。相反，它只是被“挂起”，静静等待天才经理的调度。经理会利用厨师的任何空闲瞬间去执行这些任务卡上的指令。\\n这就是关键：任务（Task）是协作式的，它们在 Tokio 的调度下共享少数几个线程，而不是独占。 这就是所谓的“绿色线程”或协程。\\n摸鱼的艺术：tokio::time::sleep 现在，任务卡上有一个指令：“等烤箱预热5分钟”。\\n笨厨师（std::thread::sleep）会死死盯着烤箱，啥也不干，白白浪费5分钟。在这期间，他这个线程被完全阻塞，无法处理任何其他事情。\\n而 Tokio 的厨师（tokio::time::sleep）则完全不同。他按下烤箱开关，然后立刻告诉经理：“烤箱预热中，5分钟后再叫我。” 然后他就潇洒地去处理别的任务卡了，比如洗菜、备料。\\nuse tokio::time::{sleep, Duration}; #[tokio::main] async fn main() { println!(\\u0026#34;⏳ 等待中...\\u0026#34;); // 非阻塞的“摸鱼”，把控制权交还给调度器 sleep(Duration::from_secs(2)).await; println!(\\u0026#34;⏰ 时间到，继续干活!\\u0026#34;); } 看，tokio::time::sleep 不会“冻结”线程，它只是把当前任务暂停，让CPU去处理成百上千个其他任务。这是构建高响应性应用的核心。\\n耐心有限公司：tokio::time::timeout 客人等不及了，催单了！天才经理必须给任务设定一个“最后期限”。\\ntimeout 函数就像给一个耗时的操作套上了一个闹钟。如果在规定时间内完不成，那就直接拉倒，执行备用计划。\\nuse tokio::time::{timeout, Duration, sleep}; async fn slow_task() { // 这个任务需要5秒 sleep(Duration::from_secs(5)).await; } #[tokio::main] async fn main() { // 我只给你2秒钟时间！ let result = timeout(Duration::from_secs(2), slow_task()).await; match result { Ok(_) =\\u0026gt; println!(\\u0026#34;✅ 任务按时完成\\u0026#34;), Err(_) =\\u0026gt; println!(\\u0026#34;❌ 超时了！不等了！\\u0026#34;), } } 这在处理网络请求时是救命稻草。你再也不用担心因为一个慢查询或第三方API的延迟，而把整个服务拖垮了。\\n谁快谁上：tokio::select! 宏 现在，经理手上同时有两件急事：A任务需要从数据库读数据，B任务需要从缓存读数据。哪个先回来就用哪个。\\nselect! 就是一场比赛。它会同时等待多个异步操作，一旦其中任何一个完成，它就立刻返回结果，并取消掉其他还在“慢悠悠”执行的操作。\\nuse tokio::time::{sleep, Duration}; #[tokio::main] async fn main() { tokio::select! { _ = sleep(Duration::from_secs(2)) =\\u0026gt; println!(\\u0026#34;😴 任务1（慢的那个）完成了\\u0026#34;), _ = sleep(Duration::from_secs(1)) =\\u0026gt; println!(\\u0026#34;🚀 任务2（快的那个）赢了!\\u0026#34;), } } 这不仅仅是“竞速”，它更是构建复杂控制流的利器。比如，你可以一边监听网络请求，一边监听一个“关闭”信号，任何一个先发生，程序都能立刻响应。优雅，太优雅了。\\n终极对决：启动1000个任务 还记得我们开头那个雇佣1000个厨师的噩梦吗？看看用 Tokio 有多简单：\\nuse tokio::time::{sleep, Duration}; #[tokio::main] async fn main() { let mut handles = vec![]; // 2秒内，轻松创建1000个并发任务 for i in 0..1000 { let handle = tokio::spawn(async move { // 每个任务只睡一小会 sleep(Duration::from_millis(10)).await; // println!(\\u0026#34;Task {i} ✅\\u0026#34;); // 注释掉以避免刷屏 }); handles.push(handle); } // 等待所有任务完成 for handle in handles { handle.await.unwrap(); } println!(\\u0026#34;🎉 1000个任务全部完成，系统毫无波澜！\\u0026#34;); } 这段代码在我的普通笔记本上跑，几乎是瞬时完成。没有线程的创建销毁开销，没有高昂的内存占用，只有行云流水的任务调度。\\n这就是 Tokio “骗局”的真相：它用轻如羽毛的“任务”替换了重如泰山的“线程”，让你用极低的成本，换来了极高的并发能力。\\n现在，你也是那个能管好万人餐厅的天才经理了。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tutorials/rust/tokio-spawn-is-not-a-thread/\",\n    \"date\": \"2025-08-11\",\n    \"section\": \"tutorials\",\n    \"tags\": [\"Rust\",\"Tokio\",\"异步\",\"并发\",\"tokio::select!\",\"tokio::timeout\",\"tokio::time::sleep\"],\n    \"categories\": [\"Rust\",\"后端开发\",\"教程\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"JavaScript 字符串 substr() 已被废弃：为什么会踩坑？最清晰替代指南（slice/substring）\",\n    \"description\": \"别再用 substr() 了！该 API 已被标准废弃且存在兼容性隐患。本文用通俗实例对比 slice() 与 substring()，提供迁移清单与最佳实践，帮你快速无痛替换。\",\n    \"content\": \"JavaScript 字符串 substr() 已被废弃：为什么会踩坑？替代用法详解 想快速答案？结论是：不要再使用 substr()。它已被标准标记为弃用，未来存在移除风险；推荐统一使用 slice()（必要时再用 substring()）。\\n下面是详细解释与迁移清单。\\n那个90%前端还在踩的坑：substr()，一个早已被浏览器“拉黑”的API！\\n你有没有经历过这样的场景：一段代码在你的电脑上跑得好好的，一上线就出了岔子？或者，你在维护一坨“上古代码”时，总感觉哪里不对劲，却又说不上来？\\n小心，你可能踩中了一颗早已被埋下的“地雷”。而这颗雷的名字，很可能就是 substr()。\\n没错，就是那个我们用来截取字符串，熟练得像每天吃饭喝水一样的 substr()。可是一个残酷的事实是：这个API已经被现代浏览器标准给“拉黑”了。它就像一个过期的罐头，虽然暂时吃不坏肚子，但随时可能让你“中毒”。\\n更惊人的是，据不完全统计，可能还有90%的开发者在项目中无意识地使用它。\\n一场“家族内斗”：为什么 substr() 被踢出群聊？ 要理解 substr() 为何失宠，我们得认识一下它的两位兄弟：slice() 和 substring()。这三位都干着截取字符串的活儿，但脾气秉性却大不相同。\\n想象一下，String 是一个大家族，这三兄弟是家族里最擅长切分家产（字符串）的。\\nslice(起点, 终点) substring(起点, 终点) substr(起点, 长度) 发现问题了吗？\\n老大 slice 和老二 substring 早就商量好了，切分家产的规矩是“从几号位置切到几号位置”，简单明了。\\n唯独老三 substr，天生“反骨”，非要自己搞一套：“从几号位置开始，数几个单位再下刀”。\\n这种不合群的设计，就是它被废弃的根本原因。这就像你开车导航，所有地图都告诉你“从人民广场开到世纪大道”，突然一个导航非要说“从人民广场出发，向东 5 公里”。在快节奏的编码中，这种思维模式的切换极易导致混乱和 bug。\\n代码不仅是给机器执行的，更是给人读的。这种不一致性，就是程序员世界的“万恶之源”。\\n王者之选：为什么 slice() 是你的最佳伴侣？ 既然 substr() 不推荐用了，那我们该用谁？首选，也是我的唯一推荐：slice()。\\nslice() 不仅严格遵守“起点-终点”的约定，它还有一个独门绝技——支持负数索引！\\n这简直是神来之笔！想取字符串末尾的几个字符？在过去，你可能需要 str.substr(str.length - 4)，又臭又长。\\n现在用 slice() 呢？\\nconst str = \\u0026#34;你好，梦兽编程！\\u0026#34;; // 想从后面取 4 个字？一个负数搞定！ str.slice(-4); // \\u0026#34;编程！\\u0026#34; // 从第 4 个字开始，切到倒数第 2 个字 str.slice(3, -1); // \\u0026#34;梦兽编程\\u0026#34; 看到没？slice() 的负数索引就像给你开了一扇后门，操作起来优雅又高效。它就像一个经验丰富、做事滴水不漏的专业人士，指令清晰，从不让你猜。\\n那个“小聪明”的兄弟：substring() substring() 也遵循“起点-终点”规则，但它有点“小聪明”，有时候反而会帮倒忙。\\n它有两个特点：\\n不认负数： 任何负数参数都会被它当成 0。 自动纠错： 如果你的起点比终点还大，比如 substring(10, 4)，它会悄悄帮你调换成 substring(4, 10)。 听起来很智能？但在严肃的编程世界里，这种“自作主张”往往是危险的。我们更希望代码在出错时能明确地报错，或者返回一个不符合预期的结果让我们快速定位，而不是静悄悄地“修正”它，把问题隐藏得更深。\\n所以，虽然 substring() 也能用，但 slice() 那种严格、可预测的行为，才是一个成熟工程师的首选。\\n迁移清单：从 substr() 到 slice() / substring() 以长度截取末尾 N 个字符： // before str.substr(str.length - N, N) // after str.slice(-N) 从索引 i 起，截取长度 N： // before str.substr(i, N) // after（等价） str.slice(i, i + N) 只给起点（到末尾）： // before str.substr(i) // after str.slice(i) 若你必须保证「较小值为起点」的行为（与 substring 一致）： const start = Math.min(a, b) const end = Math.max(a, b) str.slice(start, end) 结论：是时候和 substr() 说再见了！ 朋友，放弃 substr() 吧。\\n这不仅仅是跟上技术潮流，更是为了写出更清晰、更健壮、更易于团队协作的代码。在今天，每一次你敲下 substr()，都相当于在为未来的自己或同事埋下一颗定时炸弹。\\n从现在开始，拥抱 slice()，让你的代码告别歧义，走向光明。\\n下次当你在代码审查中看到有人还在用 substr()，请把这篇文章甩给他，并告诉他：“兄弟，该升级你的武器库了！”\\n关注梦兽编程微信公众号，解锁更多黑科技\\n常见问题（FAQ） substr() 什么时候被废弃的？还能用吗？ 被 TC39 与 WHATWG 标为弃用，短期多数浏览器仍保留，但可能随时下线或在边缘环境失效。 我项目里大量使用 substr()，需要立刻全量替换吗？ 建议在功能改动或重构时逐步替换，新增代码一律使用 slice()。 slice() 与 substring() 该如何选择？ 首选 slice()（支持负数、行为可预测）；只在必须复用 substring 的“自动交换参数”特性时考虑 substring()。 \",\n    \"permalink\": \"https://rexai.top/js-news/javascript-substr-deprecated-pitfall/\",\n    \"date\": \"2025-08-10\",\n    \"section\": \"js-news\",\n    \"tags\": [\"字符串API\",\"substr废弃\",\"slice\",\"substring\",\"浏览器兼容性\",\"代码规范\"],\n    \"categories\": [\"前端开发\",\"JavaScript\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Rust async 状态机揭秘：Future、poll、Waker 到底怎么工作？\",\n    \"description\": \"深入拆解 Rust 异步编程：为什么调用 async 不会立刻执行？Future 本质是怎样的状态机？执行器如何通过 poll 与 Waker 驱动任务前进？一文读懂 async/await 的底层运行机制。\",\n    \"content\": \"你的 Rust async 代码是个“骗子”：我把它的状态机底裤给扒了！\\n你有没有过这样的经历：你写了一个 async 函数，满心欢喜地调用了它，然后……程序“啪”一下就结束了，啥也没发生。\\n你盯着屏幕，陷入沉思：我的代码呢？我的 println! 呢？难道我刚才运行了个寂寞？\\n别慌，你不是一个人。欢迎来到 Rust async 的世界，这里的第一条规则就是：你眼睛看到的，不一定是真的。\\nasync/await 是 Rust 并发编程的王牌，它能让你用看似同步的代码，写出性能炸裂的非阻塞程序，轻松应对成千上万的网络连接。但在这优雅的语法糖背后，藏着一个精妙绝伦、却也让无数新手迷惑的底层机制。\\n今天，我就带你潜入 Rust 的“引擎室”，把 Future、.poll() 和状态机这几个核心部件给你安排得明明白白。\\n第一幕：天大的误会 —— async fn 根本不会立即执行 让我们从这个最基础的“骗局”开始。你写了这么一个函数：\\nasync fn say_hello() { println!(\\u0026#34;Hello, from the future!\\u0026#34;); } 然后你调用它：\\nfn main() { say_hello(); // 程序结束，什么都不会打印 } 为什么？因为调用一个 async 函数，并不会执行它里面的代码。它只会返回一个东西，叫做 Future。\\n什么是 Future？\\n你可以把它想象成一张“未来才会兑现的承诺券”。\\n这张券本身什么都不是，你拿着它，它不会自动变成奖品。say_hello() 函数返回的就是这么一张承诺券，上面写着：“我承诺，未来某个时候会打印一行字”。\\n你的 main 函数拿到了这张券，然后就把它扔了，程序自然就结束了。\\n记住：async 函数返回的是一个“计划”，而不是一个“结果”。\\n第二幕：引擎启动 —— Executor 和 .await 的登场 那么，怎么才能让这张“承诺券”兑现呢？\\n你需要一个“执行器”（Executor），比如大名鼎鼎的 tokio 或 async-std。\\n你可以把执行器想象成一个精力无限的厨房总管。\\n而你的 Future（承诺券），就是一张张“菜谱”。\\n当你把菜谱交给总管时，他才开始真正地干活。在代码里，这个“交由总管处理”的动作，通常是 #[tokio::main] 这个宏帮你做的，或者手动调用 block_on。\\n#[tokio::main] async fn main() { say_hello().await; // 这次，它会打印了！ } 注意那个神奇的 .await 关键字。它才是引爆这一切的“点火器”。\\n.await 到底做了什么？它对厨房总管（执行器）说：\\n“嘿，总管！我现在要开始做 say_hello 这道菜了。如果这道菜需要花时间（比如要等烤箱预热），你不用傻等，先去做别的菜。等我这儿好了，我再叫你。”\\n这就是 async/await 的核心：非阻塞。.await 就是那个允许任务“暂停”和“让出控制权”的神奇节点。\\n第三幕：深入底层 —— Future 的真面目是“状态机” 现在，让我们揭开 Future 的最终面纱。Rust 编译器看到你的 async fn，会偷偷地把它变成一个结构体，并为它实现 Future Trait。\\n这个结构体，就是一个微型的“状态机”。\\n我们来看一个稍微复杂点的例子：\\nasync fn cook_meal() { println!(\\u0026#34;开始洗菜...\\u0026#34;); let ingredients = chop_vegetables().await; // 第一个暂停点 println!(\\u0026#34;菜切好了，开始炒菜...\\u0026#34;); let dish = fry_in_pan(ingredients).await; // 第二个暂停点 println!(\\u0026#34;上菜！\\u0026#34;); } 编译器会把这个函数转换成一个类似下面这样的状态机：\\n状态0：初始状态 状态1：正在切菜 (等待 chop_vegetables 完成) 状态2：正在炒菜 (等待 fry_in_pan 完成) 状态3：完成 厨房总管（执行器）会反复地过来问这个状态机一个问题，这个问题就是 .poll() 方法：“兄弟，你搞定了没？”\\n.poll() 方法会返回两种可能的结果：\\nPoll::Ready(结果)：搞定了！ 这是我的结果，你可以进行下一步了。 Poll::Pending：还没好！ 我正在等某个东西（比如网络数据、定时器）。你先去忙别的吧，等我好了，我会通过一个叫 Waker 的东西通知你再来问我。 整个流程就像这样：\\n总管调用 cook_meal 的 poll。 代码执行 println!(\\u0026quot;开始洗菜...\\u0026quot;)。 遇到 chop_vegetables().await，总管开始 poll 切菜任务。 切菜任务需要时间，返回 Pending。总管就把 cook_meal 任务放一边，去处理其他菜谱。 过了一会儿，“切菜机”（比如某个I/O设备）发来通知，通过 Waker 唤醒了 cook_meal 任务。 总管再次 poll 这个任务，它从上次暂停的地方继续，拿到了切好的菜。 遇到 fry_in_pan().await，流程再次重复。 直到最后，poll 返回 Ready，整个任务完成。 看到了吗？没有魔法。只有一台精密的、由 poll 和 Waker 驱动的状态机。你的 async 代码，就在这台机器上，以一种高效、协作的方式，被一块块地执行。\\n总结：把大象装进冰箱 概念 大白话比喻 它的作用 async fn 一张“菜谱” 定义一个未来要执行的任务，但本身不执行。 Future 菜谱的“承诺券”和“状态记录单” 它是一个状态机，记录了任务进行到哪一步。 Executor (如 Tokio) 精力无限的“厨房总管” 管理和调度所有菜谱（Futures），让厨房不停运转。 .await “需要等待，但别干等”的指令 任务的暂停点，把控制权交还给总管。 .poll() 总管的口头禅：“搞定了没？” 驱动状态机向前一步的方法。 Waker “烤箱好了”的“闹钟” 当外部事件（如I/O）完成后，用来通知总管回来继续处理某个任务。 所以，下次当你的 async 代码表现得不符合直觉时，请记住，它不是在骗你。它只是在严格地、高效地遵循这套“厨房总管”的工作流程。而你，作为大厨，只需要写好你的菜谱，并在需要等待的地方优雅地加上一个 .await 就行了。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tutorials/rust/how-rust-async-state-machine-works-under-the-hood/\",\n    \"date\": \"2025-08-10\",\n    \"section\": \"tutorials\",\n    \"tags\": [\"rust\",\"async\",\"await\",\"future\",\"tokio\",\"并发编程\",\"状态机\",\"waker\",\"poll\"],\n    \"categories\": [\"tutorials\",\"rust\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Rust 1.89 发布：Intel Mac 平台降级，编译器新增生命周期可读性提示\",\n    \"description\": \"Rust 1.89 宣布 x86_64-apple-darwin（Intel Mac）从 Tier 1 降级为 Tier 2，并引入 mismatched_lifetime_syntaxes lint、常量泛型 '_' 推断与新 x86 指令集支持，全面提升可读性与性能。\",\n    \"content\": \"老铁们，坐稳了。Rust 官方又端上了一盘热气腾腾的新菜——1.89.0 版本。\\n别急着 rustup update stable，这次的更新，可不只是加点语法糖那么简单。里面藏着一个时代的眼泪，和一个能让无数新手喜大普奔的“贴心大妈”。\\n本兽这就带你深度解剖，看看这盘菜到底有多硬核。\\n一个时代的落幕：再见，x86_64-apple-darwin 第一个要说的，就是这件大事。\\n这么多年，苹果和英特尔的爱情长跑，终究是错付了。随着苹果全面拥抱自家的 Apple Silicon 芯片，以及隔壁 GitHub 宣布不再为公共仓库提供免费的 macOS x86_64 虚拟机，Rust 官方也正式表态了。\\n从 1.89 版本开始，x86_64-apple-darwin，也就是我们熟知的 Intel Mac 平台，正式从“亲儿子”（Tier 1）降级为“干儿子”（Tier 2）。\\n这是什么意思？\\n我给你打个比方。以前，Intel Mac 是 Rust 开发团队捧在手心里的宝，每次发版都得保证所有测试跑得通，功能好使。现在，它变成了“自生自灭”模式。官方还会编译工具链，但不再保证所有测试都通过。哪天你发现某个功能在你的老 Intel Mac 上不好使了，别惊讶，这可能就是时代的阵痛。\\n所以，如果你还在用 Intel Mac 写 Rust，是时候考虑一下未来了。要么抱紧你的 1.89 版本，要么……是时候换台新电脑了。\\n编译器化身“朝阳大妈”，专治生命周期“隐形情侣” 好了，说完沉重的话题，来说个喜闻乐见的。\\nRust 的“生命周期”（Lifetime），这玩意儿劝退了多少英雄好汉？它就像代码里的“玄学”，尤其是那个“生命周期省略规则”（Lifetime Elision），更是神出鬼没。\\n有时候，一个函数明明返回了一个带生命周期的东西，但你从签名上压根看不出来。比如下面这个：\\n// 返回的 Iter 是有生命周期的，但你看得出来吗？ fn items(scores: \\u0026amp;[u8]) -\\u0026gt; std::slice::Iter\\u0026lt;u8\\u0026gt; { scores.iter() } 这里的 \\u0026amp;[u8]，明眼人一看就知道带了个生命周期，像是在公开场合牵着手的情侣。但返回的 std::slice::Iter\\u0026lt;u8\\u0026gt; 呢？它也悄悄地“借”了 scores 的生命周期，却装作一副“单身贵族”的样子。\\n这种输入和输出在生命周期上“一个在明，一个在暗”的情况，就像一对“隐形情侣”，极易让人迷惑，一不小心就写出悬垂指针的 BUG。\\n现在，Rust 1.89 的编译器化身成了火眼金睛的“朝阳大妈”，推出了全新的 mismatched_lifetime_syntaxes lint（默认开启），专门整治这种“地下恋情”！\\n再遇到上面的代码，编译器大妈会直接给你一个警告，语重心长地劝你：\\n“小伙子，你这俩变量关系不一般呐，得让大家看清楚！在返回类型那给我老老实实写上 \\u0026lt;'_, u8\\u0026gt;，别藏着掖着！”\\n这个改动，堪称新手福音。它把“潜规则”变成了“明规则”，让代码的可读性和安全性又上了一个台阶。\\n给CPU特种兵的新装备，和一些“懒人福音” 除了上面两个重头戏，1.89 版本还带来了一堆好东西：\\n1. 常量泛型里的“你猜”模式： 以前在数组里，长度必须写得明明白白。现在，你可以用 _ 来让编译器自己猜。\\npub fn all_false\\u0026lt;const LEN: usize\\u0026gt;() -\\u0026gt; [bool; LEN] { [false; _] // 编译器：懂了，就是要 LEN 个 false 嘛！ } 这就像你妈让你去打酱油，但没说要几块钱的，老板一看你手里提的菜，就心领神会给你打了正好一盘菜的量。舒服！\\n2. CPU 指令集大放送： 为 x86 平台上的“特种兵”们发放了一批新武器，比如 sha512, sm3, sm4, avx512 等一大堆新指令集的支持。如果你是做高性能计算或者加密算法的，这波属于是“鸟枪换炮”了。\\n3. 其他稳定API： 还一口气稳定了一大波 API，比如 File::lock 系列的文件锁功能，Result::flatten 让你能更优雅地处理嵌套的 Result，还有 NonNull::from_ref 等等。都是些能实实在在提升生产力的好玩意儿。\\n总而言之，Rust 1.89 是一个承上启下的版本。它既宣告了一个硬件时代的终结，又在软件层面让开发体验变得更加人性化、更不容易犯错。\\n那个曾经因为生命周期而把你虐得死去活来的 Rust，正在变得越来越“慈眉善目”。\\n关注梦兽编程微信公众号，解锁更多黑科技\\n\",\n    \"permalink\": \"https://rexai.top/tutorials/rust/rust-1-89-intel-mac-demotion-20250809/\",\n    \"date\": \"2025-08-09\",\n    \"section\": \"tutorials\",\n    \"tags\": [\"Rust\",\"Rust 1.89\",\"Intel Mac\",\"Apple Silicon\",\"lifetime\",\"mismatched_lifetime_syntaxes\",\"lint\",\"constant generics\",\"x86\",\"AVX-512\",\"SM3\",\"SM4\",\"SHA-512\"],\n    \"categories\": [\"Rust\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"GPT-5深夜炸场：价格屠杀、代码封神，但我们等来的只是一辆“半成品”的法拉利？\",\n    \"description\": \"OpenAI 发布 GPT-5：史诗级降价与编程能力全面升级，但多模态能力缺席，引发‘性能猛兽但功能未完备’的争议。本文解析价格战、Agentic Coding、自我修复与长文本等核心看点。\",\n    \"content\": \"GPT-5深夜炸场：价格屠杀、代码封神，但我们等来的只是一辆“半成品”的法拉利？\\n昨夜，全世界的科技信徒们都熬着最深的夜，等待着AI领域的“神”——OpenAI，降下新的神谕。我们期待着一场颠覆现实的魔法秀，期待着GPT-5像它的前辈一样，再次让我们目瞪口呆，高呼“未来已来”。\\n然而，当大幕拉开，我们等来的，与其说是一场惊天动地的革命，不如说是一次精准到可怕的“外科手术”。\\n这场发布会，一半是海水，一半是火焰。火焰，点燃了全球程序员的狂欢；海水，则浇灭了无数人对“全能AI”的幻想。\\n价格屠夫，一刀砍向对手的大动脉\\n让我们先谈谈最“暴力”的部分——价格。\\nOpenAI这次不讲武德，直接掀了桌子。GPT-5的API价格，直接被打到了竞争对手Claude Opus 4.1的十五分之一！你没看错，1/15！这已经不是降价了，这是赤裸裸的“价格屠杀”。\\n想象一下，昨天你用着和黄金差不多贵的工具，今天突然告诉你，它变成了白菜价，而且性能还更强。这对Anthropic（Claude的母公司）来说，几乎是“致命一击”。对整个AI应用开发者生态而言，这意味着创新的成本被夷为平地。\\nOpenAI仿佛在用行动宣告：在这场战争里，规则由我来定。\\n代码封神，献给程序员的终极情书\\n如果说价格屠杀是“战书”，那GPT-5在编程上的进化，就是一封写给全球开发者的“情书”。\\n忘掉那些只能帮你写写代码片段的“小玩具”吧。GPT-5带来的是一个全新的物种——“智能体式编程”（Agentic Coding）。\\n这是什么概念？\\n打个比方，以前的AI是你身边的实习生，你让他干啥他干啥，但经常出错，还需要你跟在屁股后面收拾烂摊子。\\n而现在的GPT-5，更像一个经验丰富的资深架构师。你只需要给它一个模糊的需求，比如“帮我修复这个拥有上千个文件的项目里的bug”，它会自己去阅读整个代码库，理解上下文，定位问题，甚至还能理解你前任程序员留下的那些“为了安全而做出的妥协”。\\n更可怕的是，它会“自我修复”。当它写的代码第一次运行时出现bug，它会自己看错误日志，然后修改、迭代，直到完美运行。它就像一个拥有了“羞耻心”和“反思能力”的程序员，一个不知疲倦、7x24小时在线的“编程之神”。\\n现场演示的那个400行飞机空气动力学模拟，只用了2分钟。这不仅是效率的提升，这是对整个软件开发范式的颠覆。\\n“半成品”的法拉利？多模态的巨大失望\\n然而，火焰的旁边，就是冰冷的海水。\\n当我们期待它能听、能说、能看、能生成视频，像一个真正的数字生命时，GPT-5却交上了一份近乎空白的答卷。\\n它依然不支持音频和视频，甚至连图片生成都做不到。在隔壁谷歌的Genie 3已经能根据一句话生成游戏世界的今天，OpenAI的多模态能力，显得像个“偏科生”。\\n这就像所有人都期待法拉利发布一辆会飞的汽车，结果它推出了一辆速度快到极致、但连音响和空调都没有的赛道版超跑。性能强悍到令人发指，但日常的“好用”和“炫酷”，却缺了一大块。\\n两处“神迹”：被忽略的真正进化\\n在“编程惊艳”和“功能失望”的巨大反差中，有两个真正决定GPT-5“封神”的特质，被很多人忽略了。\\n第一，是**“幻觉”的大幅降低**。GPT-5犯错的概率，比GPT-4o低了整整45%。这意味着它从一个“偶尔满嘴跑火车”的天才，变成了一个“极其可靠”的专家。对于需要精准和真实的工业、科研、医疗等领域，这比任何花哨的功能都重要一万倍。这是AI从“玩具”走向“工具”最关键的一步。\\n第二，是长文本处理能力的飞跃。400k的上下文窗口，配合近乎翻倍的“大海捞针”测试准确率。这意味着你可以把一整本厚厚的书扔给它，然后精准地问其中任何一个细节，它都能对答如流。对于需要深度分析复杂文档的律师、金融分析师、研究员来说，这才是真正的“超级英雄”。\\n终极审判：OpenAI的阳谋\\n所以，GPT-5到底是一次成功的发布，还是一次失败的发布？\\n我的判断是：这是一次对大众而言略显平淡，但对行业和未来而言，却无比“毒辣”和“高明”的战略布局。\\nOpenAI看得很清楚，在当前阶段，与其追求那些华而不实、还不够成熟的“全能”，不如将最锋利的刀刃，插向最核心的战场——开发者生态和企业应用。\\n通过“价格屠杀”和“编程封神”，它要彻底锁死开发者，让他们再也离不开自己。通过大幅降低“幻觉”，它要敲开那些对AI安全性和准确性要求最严苛的企业大门。\\n这步棋，不炫，但稳、准、狠。\\nGPT-5可能不是我们想象中那个无所不能的“神”，但它，正在成为那个真正能改变世界的“工程师之神”。\\n而这场AI的权力游戏，显然才刚刚开始。\\n关注梦兽编程微信公众号，解锁更多黑科技。\\n\",\n    \"permalink\": \"https://rexai.top/tools/ai-tools/gpt-5-launch-price-massacre-coding-god-or-halffinished-ferrari/\",\n    \"date\": \"2025-08-08\",\n    \"section\": \"tools\",\n    \"tags\": [\"GPT-5\",\"OpenAI\",\"AI\",\"智能体式编程\",\"开发者工具\",\"AI 应用\",\"多模态\",\"科技新闻\"],\n    \"categories\": [],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"别再复制粘贴了！这个叫 Cursor CLI 的“怪物”让你在终端里和 AI 并肩作战。\",\n    \"description\": \"告别在浏览器与终端之间来回切换！Cursor CLI 将强大的 AI Agent 注入命令行，支持聊天式生成代码、文件读写、代码审查与自动化集成（CI/CD），帮助开发者在 SSH、Vim/Neovim、本地或远程环境下保持心流、显著提升开发效率。\",\n    \"content\": \"别再复制粘贴了！这个叫 Cursor CLI 的“怪物”让你在终端里和 AI 并肩作战。\\n嘿，兄弟，让我猜猜你的日常。\\n是不是经常遇到这个场景：你用 SSH 连着一台远程服务器，盯着日志，终于定位到了一个线上 Bug。代码就在眼前，但你却束手无策。因为你的 VSCode、JetBrains 那一套豪华的 AI 助手，全在本地机器上，鞭长莫及。\\n你只能一边开着浏览器问 ChatGPT，一边小心翼翼地把代码复制、粘贴到那个小小的黑色窗口里，生怕多一个空格，少一个分号，然后引发一场雪崩。\\n这种感觉，就像一个神枪手被夺走了他的瞄准镜，只能靠感觉射击。憋屈吗？\\n如果我告诉你，你的终端，那个最原始、最强大的工具，马上就能拥有自己的“大脑”呢？\\n你的终端，从此有了“灵魂” 认识一下今天的主角——Cursor CLI。\\n简单粗暴地讲，这是那个开发了 AI 神器 Cursor IDE 的团队，干的另一件“丧心病狂”的好事。他们把强大的 AI Agent，直接塞进了你的命令行里。\\n这玩意儿不是一个简单的工具，它更像一个住在你终端里的“贾维斯”（J.A.R.V.I.S.）。你不再是孤独地敲着一行行冰冷的命令，而是有了一个能理解你意图、帮你生成代码、审查 Bug、甚至直接执行命令的智能伙伴。\\n无论你是在本地 zsh，还是在 VSCode 的集成终端，甚至是在 JetBrains 的控制台，或是一台远在天边的服务器上，只要有命令行，它就能被唤醒。\\n告别“上下文切换”，拥抱心流编程 我们程序员最宝贵的是什么？是“心流”（Flow）。那种完全沉浸、灵感迸发的状态。\\n而打破这种状态的罪魁祸首，就是“上下文切换”。\\n每次你需要 AI 的帮助，都得离开你那专注的终端界面，切到浏览器，输入问题，复制代码，再切回来\\u0026hellip; 这个过程就像你正在厨房里做一道复杂的满汉全席，结果发现没盐了，必须换上西装，开车去三公里外的超市买。等你回来，菜早凉了，灵感也没了。\\nCursor CLI 的出现，就是直接在你厨房里建了一个要啥有啥的超级市场。\\n你需要生成一段 Python 爬虫代码？直接在终端里对它说。 你想让它帮你检查一段代码有没有逻辑漏洞？直接把文件路径丢给它。 你想把一段 JavaScript 代码改成 TypeScript？一句话的事。\\n对于那些 Vim、Neovim 的死忠粉，或者常年与服务器打交道的后端、运维工程师来说，这简直是天降福音。它让你无需离开你最熟悉、最高效的键盘阵地，就能获得顶级的 AI 支援。\\n秀肌肉时间：它究竟有多猛？ 口说无凭，我们直接上干货，看看这个“终端大脑”的几招绝活。\\n1. 聊天式生成代码： 忘掉那些复杂的语法吧。你只需要像和人聊天一样，告诉它你的需求。\\ncursor-agent chat \\u0026#34;写一个函数，用 Python 实现快速排序\\u0026#34; 瞬间，一段优雅、高效的代码就会出现在你面前，你甚至可以继续追问：“给这段代码加上详细的注释”，或者“把它改成 Go 语言版本”。\\n2. 你的 AI 文件管家： 它可以直接帮你创建、修改、读取项目中的任何文件。\\ncursor-agent chat \\u0026#34;在 ./src 目录下创建一个 a.js 文件，并写入一个 console.log(\\u0026#39;hello world\\u0026#39;)\\u0026#34; 它不仅能理解你的意图，还能与你的项目结构互动，这才是真正的智能。\\n3. 7x24 小时的代码审查员： 把你的代码文件喂给它，它就能像一位资深架构师一样，帮你找出潜在的 Bug、不规范的写法，甚至提出优化建议。\\ncursor-agent chat \\u0026#34;帮我审查一下 a.js 这个文件，看看有没有什么问题\\u0026#34; 4. 自动化脚本的“超级大脑”： 因为它本质上是命令行的工具，所以能完美融入到你的自动化工作流中。比如在 CI/CD 管道里，你可以加入一道命令，让 Cursor CLI 在代码部署前自动进行一次 AI 审查。这想象力，绝了！\\n三步唤醒你的终端 AI\\n让你的终端“活”过来，只需要一杯咖啡的时间。\\n第一步：打开你的终端，运行下面的神圣咒语。\\ncurl https://cursor.com/install -fsSL | bash 第二步：验证一下，它已经注入成功。\\ncursor-agent --version 第三步：开始对话，发出你的第一个指令！\\ncursor-agent chat \\u0026#34;你好，世界！\\u0026#34; 就是这么简单。从现在起，你的命令行工具不再是那个只会执行命令的“傻瓜”，而是一个能与你并肩作战的 AI 伙伴。\\n一个时代的落幕，另一个时代的开启 Cursor CLI 的出现，不仅仅是一个新工具那么简单。\\n它是一个信号，一个强烈的信号：AI 正在从云端、从华丽的 GUI，渗透到我们开发者最基础、最核心的工具——终端里。\\n我们正在见证一个新时代的开启。在这个时代，我们与机器的交互方式将被彻底改写。命令行，这个看似古老的界面，因为 AI 的注入，正在焕发出前所未有的生命力。\\n所以，别再犹豫了。去给你的终端装上这个“大脑”吧，亲自感受一下，什么叫“开发效率的核动力引擎”。\\n关注梦兽编程微信公众号，解锁更多黑科技。\\n\",\n    \"permalink\": \"https://rexai.top/news/cursor-cli-the-ai-coding-genie-for-your-terminal/\",\n    \"date\": \"2025-08-08\",\n    \"section\": \"news\",\n    \"tags\": [\"Cursor CLI\",\"命令行\",\"AI 助手\",\"开发效率\",\"自动化\",\"终端工具\"],\n    \"categories\": [\"AI新闻\",\"开发工具\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Claude Code限流真相：200美元无限套餐变限量供应\",\n    \"description\": \"Anthropic对Claude Code实施限流政策，200美元无限套餐用户受影响。深度分析AI服务限流原因、对开发者的影响及行业趋势，揭示AI\\\\\\\"无限使用\\\\\\\"背后的真相。\",\n    \"content\": \"Claude被薅秃了！官方\\u0026quot;一刀切\\u0026quot;限流，凭啥让咱们这些老实开发者买单？ 哥们儿，你听说了吗？AI编程圈最近出了个大事，大名鼎鼎的Claude Code，把它的一帮铁杆粉丝，特别是那些一个月掏200美金（一千四百多块啊！）的“氪金大佬”们，给惹毛了。\\n简单说，就是Anthropic（就是出Claude那家公司）发了个通知，说：“兄弟们，从8月底开始，用得太狠的人，我们要限速了啊！”\\n官方说得那叫一个好听，什么“为了大家都有得用”，还说“放心，影响不到5%的人”。\\n嘿，你品，你细品。这话术，是不是跟健身房跟你说“为了节约用水，洗澡卡每人每周限三次”一个味儿？\\n用户们直接就炸了，尤其是Reddit上，老哥们骂得那叫一个精彩。\\n有个哥们儿就说：“我一个月花200刀，图啥？不就图个随心所欲、无限畅饮吗？现在你给我整个‘每周限购’，几个意思？”\\n还有个明白人直接点破了：“服务器不稳，不是因为那帮共享账号的‘黄牛’，和那些24小时拿你家服务器当矿场使的‘矿工’吗？凭啥最后板子打在我们这些规规矩矩花钱的人身上？”\\n这事儿到底是怎么闹起来的？\\n说白了，就是被一小撮人给玩坏了。\\n我给你打个比方，你就秒懂了。\\n你花大钱，办了张顶级自助餐厅的年卡。结果有几桌人，不光自己从开门吃到打烊，还TM偷偷带着麻袋来装！桌上吃不完，兜里还要揣着走。这种，就是所谓的“数字矿工”，一个人能用掉几万个人的量。\\n还有的人呢，把自己的会员卡，租给全村的人用，在餐厅门口搞起了“拼团”。这种，就是“账号黄牛”。\\n结果呢？餐厅老板一看后台数据，人都傻了。上个月食材被吃崩了7次（服务器宕机7回），再这么下去，餐厅非得倒闭不可。\\n那咋办？老板想了个“绝妙”的主意：他不去抓那些带麻袋的，也不管那些拼团的，而是直接在前台挂个牌子——“通知：即日起，所有顾客每周限量供应，每人二两！”\\n你说这扯不扯？\\n那些正儿八经来吃饭的顾客，尤其是花最多钱的VIP，直接就懵了。我这正吃得高兴呢，你跑过来说我这周的份儿没了？\\n这下轮到咱们开发者了。那些真正靠Claude吃饭的程序员，每天要处理大量代码，正需要AI马力全开的时候，屏幕“Duang”一下弹个窗：“对不起，您本周的额度已用完。”\\n这感觉，比写代码写到一半断电还难受！\\nAI这碗饭，没你想的那么“无限”\\n说到底啊，Claude这事儿，算是把AI行业一个不能说的秘密给捅破了：AI的算力，巨贵无比！\\n咱们在这边聊得嗨，代码生成得爽，背后可都是数据中心里成千上万的GPU（就是显卡）在那儿烧钱、烧电。\\n根本就没有什么真正的“无限自助”。当吃饭的人太多，尤其是遇到带麻袋来吃的，餐厅扛不住成本，就只能出此下策了。\\n所以说，Anthropic这次虽然干得不地道，但也算是给我们所有人都提了个醒。\\n以后再看到哪个AI服务标榜“无限使用”，咱们心里得先打个问号了。毕竟，天下没有免费的午餐，就算有，也得防着有人带麻袋来跟你抢。\\n觉得有点意思？关注梦兽编程微信公众号，咱俩聊点更黑科技的。\\n\",\n    \"permalink\": \"https://rexai.top/tools/ai-tools/claude-code-unlimited-plan-is-a-joke/\",\n    \"date\": \"2025-08-07\",\n    \"section\": \"tools\",\n    \"tags\": [\"Claude Code\",\"AI工具\",\"限流\",\"开发者\",\"订阅服务\"],\n    \"categories\": [],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"LocalStorage 终极指南：5个致命陷阱，99%开发者踩过坑\",\n    \"description\": \"深度解析 LocalStorage 的5个关键缺陷：同步阻塞、跨窗口通信、数据类型限制、存储容量限制、安全隐患。包含实战代码示例和最佳实践。\",\n    \"content\": \"LocalStorage 终极指南：5个致命陷阱，99%开发者踩过坑 嘿，各位前端战友们！\\n提到 LocalStorage，你是不是觉得它就像个老实巴交的工具人？一个随叫随到、任劳任怨的浏览器仓库管理员？我们天天用它存点数据，感觉熟悉得就像左手摸右手。\\n但说真的，你这位“老朋友”，其实藏着不少秘密。它有些怪癖，有些“黑料”，你要是不知道，关键时刻它就能给你来个背刺，让你加班到夜深人静，对着电脑屏幕怀疑人生。\\n今天，我就来当一回“扒皮先锋”，揭露 LocalStorage 的 5 个惊天“黑料”，带你看看它不为人知的一面。\\n黑料一：它是个“路霸”，一人干活，全家罚站 你可能觉得 localStorage.setItem('key', 'value') 这行代码快如闪电，但真相是，它是个不折不扣的“路霸”！\\nLocalStorage 的所有操作都是同步的。这是什么概念？\\n打个比方，你的代码是条繁华的单行道（浏览器的主线程），各种车辆（渲染、动画、用户交互）都在有序通行。突然，localStorage 这辆大卡车要停车卸货（读写数据）。它不管三七二十一，直接把路一横，大喊一声：“都别动，等我搞完！”\\n于是，整条路都堵死了。动画卡住了，页面点击没反应了，用户以为电脑死机了。虽然对于小数据，这个过程快到你感觉不到，但如果你尝试存入一个稍微大点的 JSON 字符串，那画面的卡顿感，绝对酸爽。\\n// 想象一下，如果这个 aBigObject 序列化后有几MB大 // 当执行这行代码时，你的页面可能会瞬间“冻结” try { localStorage.setItem(\\u0026#39;massiveData\\u0026#39;, JSON.stringify(aBigObject)); } catch (e) { console.error(\\u0026#34;哎呀，仓库满了，放不下了！\\u0026#34;, e); } 避坑指南： 别用它来存储需要频繁更新或体积庞大的数据。对于那些大家伙，请把它们交给异步的 IndexedDB 或者干脆交给后端。\\n黑料二：它是个“大嘴巴”，能跨窗口“隔空喊话” 你以为每个浏览器标签页都是一座孤岛？LocalStorage 告诉你：天真了！\\n它其实是个隐藏的“情报大师”。当你在一个页面（比如 a.com/page1）修改了 localStorage，所有同源（也就是同一个网站 a.com 下）的其他页面，都能立刻收到“风声”。\\n这个“隔空喊话”的功能，是通过 storage 事件实现的。\\n// 在你的另一个同源标签页里监听 window.addEventListener(\\u0026#39;storage\\u0026#39;, (event) =\\u0026gt; { console.log(\\u0026#39;隔壁老王家好像有动静了！\\u0026#39;); console.log(`键：${event.key}`); console.log(`旧值：${event.oldValue}`); console.log(`新值：${event.newValue}`); console.log(`搞事情的页面：${event.url}`); }); 这个特性酷毙了！你可以用它来实现多标签页之间的状态同步。比如，用户在一个页面登录后，其他打开的页面可以自动“刷新”成登录状态；在一个页面把商品加入购物车，其他页面的购物车图标也能实时更新。是不是瞬间感觉格局打开了？\\n黑料三：它是个“偏食怪”，只吃字符串 这是新手最容易踩的坑，没有之一。LocalStorage 表面上看起来什么都能存，但它的胃口极其挑剔，只认一样东西——字符串。\\n你兴高采烈地丢给它一个对象：\\nconst user = { name: \\u0026#39;梦兽编程\\u0026#39;, level: 99 }; localStorage.setItem(\\u0026#39;userInfo\\u0026#39;, user); 然后你去取：\\nconst info = localStorage.getItem(\\u0026#39;userInfo\\u0026#39;); console.log(info); // 输出啥？ \\u0026#34; [object Object] \\u0026#34; console.log(info.name); // undefined，直接报错！ 你的对象被它无情地转换成了呆板的 \\u0026quot;[object Object]\\u0026quot; 字符串，所有信息都丢失了。\\n正确喂食方法： 在存入前，先用 JSON.stringify() 把它变成“JSON味”的字符串；在取出后，再用 JSON.parse() 给它“复原”。\\n// 存入：先打成字符串 localStorage.setItem(\\u0026#39;userInfo\\u0026#39;, JSON.stringify(user)); // 取出：再变回对象 const userObject = JSON.parse(localStorage.getItem(\\u0026#39;userInfo\\u0026#39;)); console.log(userObject.name); // \\u0026#34;梦兽编程\\u0026#34;，这回对了！ 黑料四：它的“豪宅”其实只有 5MB LocalStorage 经常被我们想象成一个无限大的仓库，但实际上，它只是个“经济适用房”，大多数浏览器的实现都把它的大小限制在 5MB 左右。\\n你可能觉得 5MB 很大了，但如果你不停地往里面塞图片（的Base64编码）、日志、或者各种缓存数据，总有一天，它会冷酷地向你抛出一个 QuotaExceededError 异常，告诉你：“地主家也没有余粮了！”\\n避坑指南： 对 localStorage 的使用要有所节制，把它当成寸土寸金的宝地。定期清理无用数据，并且在执行 setItem 时，最好用 try...catch 包裹起来，优雅地处理可能出现的“爆仓”异常。\\n黑料五：它从不锁门，谁都能“入室盗窃” 这是最致命、最需要警惕的“黑料”！LocalStorage 的安全性，约等于裸奔。\\n它就像一个从不上锁的抽屉，任何运行在你页面上的 JavaScript 代码都能轻松翻阅其中的所有内容。这意味着，如果你的网站遭受了 XSS（跨站脚本攻击），攻击者注入的一小段恶意脚本，就能把你的 localStorage 翻个底朝天。\\n如果你把用户的登录凭证（比如 JWT Token）这种敏感信息存在这里，那就等于把家门钥匙挂在了门外，欢迎各路黑客前来“做客”。\\n// 任何在页面上运行的JS都能执行这行代码 const userToken = localStorage.getItem(\\u0026#39;user_token\\u0026#39;); // 然后就可以把 token 发送到攻击者的服务器了... // (此处省略恶意代码) 安全第一： 永远、永远、永远不要在 LocalStorage 中存储任何敏感数据！比如密码、Token、个人身份信息等。对于这类数据，请使用更安全的 HttpOnly Cookies，它能有效防止被 JavaScript 读取，从而抵御 XSS 攻击。\\n总结 (结构升华) 好了，LocalStorage 的五大“黑料”就扒到这里。\\n它不是那个任劳任怨的傻白甜，而是一个性格鲜明、优缺点共存的强大工具。它会“堵路”，但也能“隔空喊话”；它很“偏食”，但“豪宅”容量有限；最重要的是，它“从不锁门”。\\n真正的高手，不是因为他知道的工具多，而是因为他对自己手中的每一个工具都了如指掌，知道它的脾气，善用它的优点，规避它的缺陷。\\n希望这次的“爆料”，能让你对 LocalStorage 有一个全新的、更深刻的认识。\\n想解锁更多这样让你“哦豁”一声的编程黑科技吗？关注梦兽编程微信公众号，解锁更多黑科技，让我们一起把技术玩出花来！\\n\",\n    \"permalink\": \"https://rexai.top/js-news/localstorage-5-secrets-every-developer-must-know/\",\n    \"date\": \"2025-08-04\",\n    \"section\": \"js-news\",\n    \"tags\": [\"LocalStorage\",\"浏览器API\",\"性能优化\",\"Web安全\",\"前端最佳实践\"],\n    \"categories\": [\"前端开发\",\"JavaScript\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Apple Silicon (M1/M2) 上 Zig 性能分析生存指南\",\n    \"description\": \"在 Apple Silicon (M1/M2) 上进行 Zig 性能分析可能会遇到困难，因为 perf、valgrind 等常用工具不受支持。本指南介绍了一些替代工具，如 Samply、poop 和 Tracy，帮助您在 macOS 上分析和优化 Zig 代码。\",\n    \"content\": \"M1/M2 芯片玩 Zig，性能分析如履薄冰？这几把“瑞士军刀”请收好！ 嘿，兄弟，如果你正揣着一台崭新的 Apple Silicon Mac，满怀激情地写着 Zig 代码，那么恭喜你，你选择了一条风景独特却又充满挑战的“朝圣”之路。\\n在这条路上，你很快会发现一个残酷的现实：当你想搞清楚你的代码为什么慢、瓶颈在哪里时，你会发现自己仿佛置身于一片广袤的性能分析荒漠。那些在 Linux 大神们手中出神入化的神器——perf、valgrind、tracy（完全体）——到了 macOS 这片新大陆，要么水土不服，要么干脆罢工。\\nperf？人家是 Linux 内核的亲儿子，跟你 aarch64 上的 macOS 不熟。valgrind？对不起，arm64 的 macOS 它也玩不转。tracy？虽然能用，但最关键的调用栈采样功能却被阉割了，像个被拔了牙的老虎。\\n是不是感觉手里的 M2 Pro 瞬间就不香了？别急着从入门到放弃，这片荒漠里，还是有几片顽强的“绿洲”的。今天，我就给你介绍这几位能在苹果芯上助你一臂之力的“侠客”。\\n快枪手：Samply 当你需要快速给你的程序“把个脉”，看看它大概在忙些什么时，Samply 就是那位二话不说、拔枪就射的牛仔。 它是一个采样分析器，默认每毫秒（1000Hz）对你程序的堆栈进行一次快照，不管你的 CPU 是在摸鱼还是在忙活，它都记录在案。最赞的是，它背后依赖的是苹果自家的 Mach 接口，并且用上了 Firefox Profiler 作为 UI，界面功能丰富，火焰图、调用树、源码查看一应俱全。\\n怎么请这位枪手出山？ 用 Homebrew 就一行命令： brew install samply\\n怎么用？ 直接让它启动你的程序： samply record \\u0026lt;你的程序\\u0026gt; 或者附加到已经运行的进程上（需要一些额外设置）： samply record -p \\u0026lt;进程ID\\u0026gt;\\n一句话总结： 日常性能问题的首选侦察兵，快速、直观、好上手。\\n“土”味大杀器：poop 你没看错，这工具就叫 poop (Performance Optimizer Observation Platform 的缩写)。别笑，这可是 Zig 语言之父 Andrew Kelley 亲自打造的神器。\\n这名字虽然接地气得有点过分，但它的威力绝对让你大跌眼镜。它不是简单地看时间花费，而是直接深入到硬件层面，告诉你诸如“分支预测失败了多少次”、“执行了多少条指令”这类硬核信息。当你想在两次代码修改之间进行精确的性能对比时，poop 就是你的终极裁判。\\n不过，这位“大杀器”有点脾气。官方版 poop 依赖 perf，所以在 macOS 上也得歇菜。幸运的是，有社区大神基于苹果的私有框架 kperf 搞了个能在 Apple Silicon 上运行的 fork 版本。\\n怎么请这位“大隐于市”的高手？ 你需要从一个特定的分支克隆并手动编译（具体步骤参考原文，有点折腾，但绝对值得）。\\n怎么用？ 因为它动用了私有 API，所以需要 root 权限： sudo poop \\u0026lt;命令1\\u0026gt; \\u0026lt;命令2\\u0026gt; ... 它会运行并对比这些命令的硬件性能计数器，告诉你哪个版本才是真正的“快”。 一句话总结： 名字虽然奇葩，但做迭代性能优化时，它是无可替代的“法官”。\\n美丽但“残缺”的艺术家：Tracy Tracy 就像一位技艺高超、台风华丽的艺术家。它是一个插桩和采样分析器，UI 极其强大，支持远程分析，功能多到令人发指。\\n理论上，你可以用它来给一个长时间运行的程序做非常精细的性能解剖。但现实是骨感的，在 Apple Silicon 这个舞台上，这位艺术家忘了一半的舞步——它的调用栈采样功能，在这里是缺席的。\\n这意味着你依然可以用它强大的插桩功能（手动在代码里埋点），但无法获得那种全自动、总览全局的堆栈信息。这使得在 macOS 上的集成过程变得相当繁琐，你需要修改 build.zig，在代码里手动添加 Tracy 的客户端库和各种宏。\\n一句话总结： 如果你需要精细到“像素级”的手动插桩分析，且不介意复杂的集成过程，Tracy 依然是个不错的选择。但对于大多数场景，它在 Apple Silicon 上的残缺是个硬伤。\\n官方“老爷车”：Apple Instruments 最后，我们得聊聊苹果官方的“亲儿子”——Instruments。 作为官方工具，它的功能之强大毋庸置疑，CPU 分析、硬件计数器、GPU 使用率、网络流量……几乎无所不能，上面提到的 samply 和 poop 能干的活，它基本上都能干，甚至干得更多。\\n但它的问题也很突出：慢！\\n一个用来分析性能的工具，自己却有性能问题，这笑话本身就够我笑一天了。它的 UI 和整个应用都给人一种沉重感，启动和导出数据都异常缓慢。用原作者的话说，一个4秒就能跑完的程序，用 Instruments 跑3次再导出个 XML，足足花了40秒！\\n一句话总结： 它是你的最后底牌。当其他工具都无法满足你刁钻的需求时，才需要请出这位功能强大但行动迟缓的“老法师”。\\n结论：荒漠求生，选对工具 好了，伙计，寻宝图已经给你了。虽然 Apple Silicon 上的 Zig 性能分析生态不如 Linux 那么繁荣，但我们绝非束手无策。\\n想快速看一眼？找 Samply。 想精细对比优化效果？祭出 poop。 想对特定代码段长期监控插桩？研究一下 Tracy。 实在没辙了？那就耐心点，打开 Apple Instruments 吧。 在这条探索之路上，我们都是披荆斩棘的先行者。\\n关注梦兽编程微信公众号，解锁更多黑科技。\\n\",\n    \"permalink\": \"https://rexai.top/news/zig-profiling-on-apple-silicon-survival-guide/\",\n    \"date\": \"2025-08-01\",\n    \"section\": \"news\",\n    \"tags\": [\"Zig\",\"Performance\",\"Apple Silicon\",\"macOS\",\"Profiling\"],\n    \"categories\": [\"Programming\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"HTML推测规则(Speculation Rules)实战指南：通过预取和预渲染实现即时页面加载\",\n    \"description\": \"详解HTML5推测规则API，用6行代码实现网页预加载和预渲染，让网站加载速度提升90%。包含Chrome Speculation Rules完整配置和兼容性解决方案。\",\n    \"content\": \"HTML推测规则(Speculation Rules)实战：6行代码实现网页秒开效果 摘要：本文详细介绍HTML5推测规则(Speculation Rules)技术，通过6行HTML代码实现网页预加载和预渲染，显著提升网站加载速度90%以上。包含完整的Chrome 121+实现方案和跨浏览器兼容性解决方案。\\n你是否有过这样的体验？在某个网站上点击一个链接，页面“唰”地一下就出现了，没有丝毫的白屏和等待，仿佛不是在跳转，而是在进行“瞬间移动”。\\n你可能会以为那是什么复杂的单页应用（SPA）框架或者烧钱的服务器优化。但如果我告诉你，这种丝滑到令人发指的体验，可能仅仅是因为网站主在 \\u0026lt;head\\u0026gt; 标签里，悄悄放了 6 行看似平平无奇的 HTML 代码呢？\\n这不是魔法，但胜似魔法。这背后，是 Chrome 浏览器正在推广的一项名为“推测规则（Speculation Rules）”的新技术。它就像是给你的网站配备了一位能够“读心”的超级管家，能预判用户的意图，并提前把一切准备就绪。\\n什么是HTML推测规则(Speculation Rules)？ HTML推测规则是HTML5的一项新特性，允许浏览器智能预加载和预渲染用户可能访问的页面。这项技术通过Chrome 121+版本实现，能够显著提升网站性能表现。\\n核心技术原理：推测规则如何工作？ 想象一下，你的网站就是一座宏伟的庄园，而用户就是来访的贵宾。在没有这位管家之前，贵宾想去哪个房间（页面），都得自己走到门口，推开门，等里面的灯亮起来（加载完成），才能看清房间内的景象。\\n现在，你把下面这段“咒语”放进了网站的“大脑”（\\u0026lt;head\\u0026gt;标签）：\\n\\u0026lt;script type=\\u0026#34;speculationrules\\u0026#34;\\u0026gt; { \\u0026#34;prerender\\u0026#34;: [{ \\u0026#34;where\\u0026#34;: { \\u0026#34;href_matches\\u0026#34;: \\u0026#34;/*\\u0026#34; }, \\u0026#34;eagerness\\u0026#34;: \\u0026#34;moderate\\u0026#34; }], \\u0026#34;prefetch\\u0026#34;: [{ \\u0026#34;where\\u0026#34;: { \\u0026#34;href_matches\\u0026#34;: \\u0026#34;/*\\u0026#34; }, \\u0026#34;eagerness\\u0026#34;: \\u0026#34;moderate\\u0026#34; }] } \\u0026lt;/script\\u0026gt; 实战代码：6行HTML实现网页秒开 这段代码就是实现网页秒开的核心配置，支持prefetch预加载和prerender预渲染两种模式：\\n1. Prefetch预加载模式 作用机制：当用户鼠标悬停在链接上超过200毫秒时，浏览器会提前下载目标页面的HTML文档，但不执行任何脚本或样式渲染。\\n性能提升：可减少页面加载时间30-50%，特别适用于内容型网站和博客。\\n使用场景：新闻网站、博客、文档站点等以内容为主的页面。\\n2. Prerender预渲染模式 作用机制：不仅下载HTML文档，还会完全渲染整个页面，包括CSS样式执行、JavaScript脚本运行和图片资源加载。\\n性能提升：可实现零延迟页面跳转，用户体验接近原生应用。\\n使用场景：电商网站、Web应用、需要极致用户体验的场景。\\n配置说明：代码中的 \\u0026quot;eagerness\\u0026quot;: \\u0026quot;moderate\\u0026quot; 参数设置了200毫秒的触发延迟，避免误触发造成资源浪费。\\n浏览器兼容性分析：Chrome 121+专属技术 支持情况：\\n✅ Chrome 121+: 完全支持推测规则API ✅ Edge 121+: 基于Chromium，完全支持 ❌ Firefox: 暂不支持，需使用polyfill方案 ❌ Safari: 暂不支持，需使用传统预加载 版本支持统计：目前全球约有65%的用户可以使用这项技术，主要集中在桌面端Chrome用户。\\n给“麻瓜”的安慰奖 那是不是意味着其他浏览器的用户就只能继续忍受“龟速”加载呢？当然不。虽然他们用不了 prerender 这个神级魔法，但我们可以用一段小小的 JavaScript，教会他们 prefetch 这个“基础把式”。\\n\\u0026lt;!-- 跨浏览器预加载兼容方案 --\\u0026gt; \\u0026lt;script\\u0026gt; // 检测浏览器是否支持Speculation Rules API if (!HTMLScriptElement.supports || !HTMLScriptElement.supports(\\u0026#39;speculationrules\\u0026#39;)) { const preloadedUrls = {}; // 鼠标悬停预加载处理函数 function pointerenterHandler () { if (!preloadedUrls[this.href]) { preloadedUrls[this.href] = true; const prefetcher = document.createElement(\\u0026#39;link\\u0026#39;); // 智能选择预加载方式 prefetcher.as = prefetcher.relList.supports(\\u0026#39;prefetch\\u0026#39;) ? \\u0026#39;document\\u0026#39; : \\u0026#39;fetch\\u0026#39;; prefetcher.rel = prefetcher.relList.supports(\\u0026#39;prefetch\\u0026#39;) ? \\u0026#39;prefetch\\u0026#39; : \\u0026#39;preload\\u0026#39;; prefetcher.href = this.href; document.head.appendChild(prefetcher); } } // 为所有内部链接添加预加载 document.querySelectorAll(\\u0026#39;a[href^=\\u0026#34;/\\u0026#34;]\\u0026#39;).forEach(item =\\u0026gt; { item.addEventListener(\\u0026#39;pointerenter\\u0026#39;, pointerenterHandler); }); } \\u0026lt;/script\\u0026gt; 实施指南：如何在你的网站部署推测规则 步骤1：基础配置 将以下代码添加到网站的 \\u0026lt;head\\u0026gt; 标签中：\\n\\u0026lt;!-- HTML推测规则配置 --\\u0026gt; \\u0026lt;script type=\\u0026#34;speculationrules\\u0026#34;\\u0026gt; { \\u0026#34;prerender\\u0026#34;: [{ \\u0026#34;where\\u0026#34;: { \\u0026#34;href_matches\\u0026#34;: \\u0026#34;/*\\u0026#34; }, \\u0026#34;eagerness\\u0026#34;: \\u0026#34;moderate\\u0026#34; }], \\u0026#34;prefetch\\u0026#34;: [{ \\u0026#34;where\\u0026#34;: { \\u0026#34;href_matches\\u0026#34;: \\u0026#34;/*\\u0026#34; }, \\u0026#34;eagerness\\u0026#34;: \\u0026#34;moderate\\u0026#34; }] } \\u0026lt;/script\\u0026gt; 步骤2：兼容性处理 添加跨浏览器支持代码：\\n\\u0026lt;!-- 兼容性解决方案 --\\u0026gt; \\u0026lt;script\\u0026gt; // 检测浏览器支持情况 if (!HTMLScriptElement.supports || !HTMLScriptElement.supports(\\u0026#39;speculationrules\\u0026#39;)) { // 传统预加载方案 const preloadedUrls = {}; function pointerenterHandler () { if (!preloadedUrls[this.href]) { preloadedUrls[this.href] = true; const prefetcher = document.createElement(\\u0026#39;link\\u0026#39;); prefetcher.as = \\u0026#39;document\\u0026#39;; prefetcher.rel = \\u0026#39;prefetch\\u0026#39;; prefetcher.href = this.href; document.head.appendChild(prefetcher); } } document.querySelectorAll(\\u0026#39;a[href^=\\u0026#34;/\\u0026#34;]\\u0026#39;).forEach(item =\\u0026gt; { item.addEventListener(\\u0026#39;pointerenter\\u0026#39;, pointerenterHandler); }); } \\u0026lt;/script\\u0026gt; 常见问题解答(FAQ) Q1: 推测规则会影响服务器性能吗？ A: 影响极小。预加载只在用户有明显交互意图时触发，且可以通过设置eagerness参数控制触发时机。\\nQ2: 如何控制预加载的页面范围？ A: 可以通过修改where条件限制预加载范围，例如：\\n{\\u0026#34;where\\u0026#34;: {\\u0026#34;href_matches\\u0026#34;: \\u0026#34;/blog/*\\u0026#34;}} Q3: 移动端支持情况如何？ A: Chrome Android 121+完全支持，iOS Safari暂不支持。\\nQ4: 会增加多少流量消耗？ A: 仅预加载用户可能访问的页面，平均增加10-15%流量，但显著提升用户体验。\\nQ5: 如何监控推测规则效果？ A: 使用Chrome DevTools的Performance面板查看预加载情况。\\n性能测试数据 根据实际测试数据：\\n页面加载时间：平均减少60-90% 首次内容绘制(FCP)：提升80% 最大内容绘制(LCP)：提升75% 用户体验评分：提升40% 最佳实践建议 渐进式部署：先在部分页面测试效果 监控流量：观察服务器带宽使用情况 用户分群：为不同用户群体设置不同策略 A/B测试：验证预加载对转化率的影响 总结 HTML推测规则是一项革命性的性能优化技术，通过简单的配置就能实现显著的性能提升。虽然当前支持有限，但随着Chrome生态的普及，这项技术将成为前端性能优化的标准配置。\\n立即行动：将上述代码部署到你的网站，体验\\u0026quot;秒开\\u0026quot;效果的魔力！\\n延伸阅读：\\nChrome官方文档：Speculation Rules API Web.dev性能优化指南 关注梦兽编程微信公众号，获取更多前沿前端技术教程。\\n\",\n    \"permalink\": \"https://rexai.top/js-news/html-speculation-rules-instant-page-load/\",\n    \"date\": \"2025-08-01\",\n    \"section\": \"js-news\",\n    \"tags\": [\"HTML5\",\"Chrome\",\"性能优化\",\"预加载\",\"推测规则\"],\n    \"categories\": [\"前端技术\",\"性能优化\"],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"Rust后端开发者必读：为何拥抱TypeScript是你的下一个超能力\",\n    \"description\": \"一个资深Rust后端开发者，从鄙视JS到拥抱TypeScript的心路历程。探讨Rust与TypeScript如何通过ts-rs等工具协同，打造类型安全、坚不可摧的全栈应用。\",\n    \"content\": \"从JS的混沌到TypeScript的禅定：一个Rust后端程序员的顿悟 哥们，让我猜猜。\\n你是不是一个后端程序员？每天和 Java 的 Spring、Rust 的 Axum 或者 Python 的 Django 亲密无间，享受着强类型、严谨架构带来的那种“一切尽在掌握”的快感？\\n然后，你瞥了一眼隔壁前端同事屏幕上花花绿綠的 JavaScript 代码，嘴角是不是划过一丝不屑？\\n“切，这玩意儿也叫编程？”\\n如果被我说中了，别紧张。因为，我曾经也和你一模一样。\\n我热爱 JavaScript，从它还野得像个没人管的疯孩子时，我就在它身边了。不是因为它有多优雅，也不是因为它逻辑多清晰，而是因为它拥有其他语言无法企及的一样东西：\\n那就是在浏览器里、在每一个屏幕上呼风唤雨的、最原始的统治力！\\n今天，很多人看着被 TypeScript、React 全副武装的现代 JavaScript，点点头说：“嗯，现在总算能用了。”\\n但我，早在它“从良”之前，就看到了它的价值。\\n这篇文章不是一篇教程。这是一个后端老兵从**“鄙视”到“真香”**的心路历程。如果你也是一个还在对 JS 持有偏见的后端开发者，我只想对你说一句话：\\n别再抗拒 Web 的浪潮了，你应该去驾驭它！\\n想当年，JavaScript 就是个狂野的西部世界 在那个遥远的 2010 年代，写 JS 简直就像蒙着眼睛走钢丝。\\n全局变量满天飞，一不小心就污染了整个世界。 == 和 === 的爱恨情仇，能让你在调试时怀疑人生。 没有模块，没有类型，更别提什么代码检查工具了。 IE、Chrome、Firefox 三国鼎立，一段代码，三种死法。 那时候，你不是在写应用，你是在雷区里跳舞。\\n比如下面这段远古代码，现在看简直是“犯罪现场”：\\n// 蛮荒时代的JS代码 function doStuff(a, b) { if (a == b) { // 天知道这里会发生什么隐式转换 alert(\\u0026#34;它们匹配了\\u0026#34;); } } 但即便如此，我还是爱死了那种感觉。那就像是在“黑入”现实世界。我用最原始的 DOM 操作，写出了表单、动画、幻灯片。虽然代码丑得不忍直视，但它能跑，而且跑在每个人的电脑上！\\n黎明前的曙光：jQuery、ES6 和理智的回归 然后，变革的浪潮来了。\\njQuery 横空出世，这位“带善人”让操作 DOM 变得不再那么反人类。 JSON 成了 API 的通用语，前后端总算有了共同的沟通方式。 ES6 带着天神下凡，let/const、箭头函数、Promise……它让 JS 看起来终于像一门“正经”语言了。 Node.js 炸开了后端的大门，JS 第一次走出了浏览器，开始在服务器端搅动风云。 突然之间，JS 不再只是个浏览器里的“小丑脚本”，它成了一门真正的语言。\\n我看到很多老派的开发者对此嗤之以鼻：“还是太松散了，不成体统。”\\n但我却一头扎了进去。因为我能感觉到，这场混乱，正在孕育着伟大的秩序。\\n今天的JS：类型安全、框架加持、武装到牙齿 快进到现在。我写的 JavaScript，和我刚出道时写的，已经完全是两个物种了。\\nTypeScript 带来了我们后端最爱的类型安全。 React/Vue 让我们用组件化的思维优雅地抽象 UI。 Vite/Webpack 提供了快如闪电的构建体验。 ESLint + Prettier 负责把你的代码收拾得比你的桌面还干净。 Jest/Playwright 让自动化测试变得轻而易举。 Node/Deno/Bun 在后端和工具领域大杀四方。 看看现在的代码，这还是你印象中的那个“弱鸡”吗？\\n// 现代 TypeScript + React 代码片段 type User = { id: number; name: string }; const UserCard: React.FC\\u0026lt;{ user: User }\\u0026gt; = ({ user }) =\\u0026gt; ( \\u0026lt;div className=\\u0026#34;card\\u0026#34;\\u0026gt;{user.name}\\u0026lt;/div\\u0026gt; ); 这已经不是玩具了。这是驱动着无数真实商业系统的工业级引擎。\\n后端大佬们，求求了，别再躲着 JavaScript 了！ 如果你来自 Rust、Go 或 Java 的世界，我完全理解你的犹豫。\\nJS 感觉……太不一样了，太乱了。\\n但如果你选择彻底无视它，你失去的将是：\\n对前端的控制权：你将永远受制于人。 构建全栈应用的能力：你只能做“半个”程序员。 错过 SSR/SPA/边缘计算的浪潮：这些技术能极大提升产品体验。 严重依赖第三方 UI 团队：沟通成本高，效率低下。 你不需要成为一个 React 大师。但你必须具备：\\n基本的 JS 语言能力 能看懂并编写 TypeScript 理解主流框架的思想 在浏览器里独立调试问题的能力 因为猜猜怎么着？\\n就算你用 Yew 或者 Leptos，你的代码最终还是会编译成 WebAssembly，并且与那个只说一种语言的浏览器交互。而那个语言，就是 JavaScript。\\n打通任督二脉：当 Rust 与 TypeScript 开始“说人话” 对我来说，最神奇的时刻，是当我意识到，我可以在前后端之间共享同一套业务逻辑，而不会产生任何偏差。\\n我给你讲一个我曾经追了好几天的 Bug。\\n我的 UI 总是告诉用户订单“可以发货了”，但后端却还没确认。用户很生气，我也很崩溃。\\n为什么？因为前端和后端对于“可以发货”的定义，有那么一丁点的不同。\\n在我的 Rust 代码里，逻辑是这样的：\\n// lib.rs #[derive(serde::Serialize)] pub struct Order { pub status: String, pub total: f64, } impl Order { pub fn is_shippable(\\u0026amp;self) -\\u0026gt; bool { self.status == \\u0026#34;Confirmed\\u0026#34; \\u0026amp;\\u0026amp; self.total \\u0026gt;= 50.0 } } 但在 JavaScript 里，检查稍微松散了一点，然后随着时间推移，这里的逻辑变得越来越复杂，最终导致了不一致。\\n直到我找到了神器 ts-rs。它能直接从我的 Rust 数据结构，自动生成 TypeScript 的类型定义。\\n这意味着：\\nAPI 的数据结构，自动生成 TypeScript 类型，再也不会错。 枚举和常量，前后端共享一份，永远同步。 一个强类型的 API 客户端，让调用后端就像调用一个本地方法一样简单。 现在，只要我修改了后端的 is_shippable 逻辑，前端的类型定义就会自动更新。一个地方修改，处处同步。\\n朋友们，这不是为了方便，这是为了拯救我们的头发！\\nJavaScript 从来都不是问题，无知和偏见才是 真相是：\\nJavaScript 的胜利，不是因为它天生丽质。\\n而是因为它无处不在。\\n而现在，当它已经变得结构化、类型化，并且经过了战火的考验，我们真的没有任何借口再把它拒之门外了。\\n如果你脑子里还回响着那句：\\n“我不喜欢JS，它就是一团乱麻。”\\n那你还活在 2010 年。2025 年的 JavaScript 技术栈，早已是精干、强大、可信赖的代名词。\\n对于我们这些花了数年时间在后端世界里追求严谨和完美的开发者来说，拥抱现代 JavaScript，不是一种倒退，而是解锁你的下一个超能力。\\n别再犹豫了。\\n去用 TypeScript 写一个 Hello World。 去玩玩 Vue 或 React。 去用 Node 写一个命令行小工具。\\n很快，你就会停止问：“为什么是 JavaScript？”\\n然后开始感叹：\\n“为什么我没有早点开始？”\\n关注梦兽编程微信公众号，解锁更多黑科技。\\n\",\n    \"permalink\": \"https://rexai.top/news/why-backend-devs-should-embrace-typescript-from-a-rust-veteran/\",\n    \"date\": \"2025-07-30\",\n    \"section\": \"news\",\n    \"tags\": [\"TypeScript\",\"JavaScript\",\"Rust\",\"Backend\",\"Web开发\",\"全栈\",\"前端\",\"ts-rs\",\"WebAssembly\"],\n    \"categories\": [],\n    \"lang\": \"zh-cn\"\n  },\n  {\n    \"title\": \"智谱GLM-4.5发布：挑战GPT-4的AI代码能力新标杆\",\n    \"description\": \"智谱AI发布GLM-4.5系列模型，拥有3550亿参数，在SWE-bench测试中超越GPT-4.1，全球AI排名第三，支持代码生成、PPT制作、网站开发等全栈能力。\",\n    \"content\": \"智谱GLM-4.5发布：挑战GPT-4的AI代码能力新标杆 引言：AI格局的新变革 就在所有人都以为AI格局已定时，牌桌被一个新玩家掀了。\\n今天，别再只盯着OpenAI和谷歌了，把目光转向东方，智谱AI带着他们最新的\\u0026quot;王炸\\u0026quot;——GLM-4.5系列模型，正式向全世界宣告：\\u0026ldquo;我，全都要！\\u0026rdquo;\\n这不是一次常规升级，这可能是一次AI能力的\\u0026quot;物种跃迁\\u0026quot;。过去，我们总在纠结，哪个模型数学好，哪个模型代码强，哪个模型更会聊天。而GLM-4.5给出的答案是：小孩子才做选择，成年人的世界里，顶级的能力我必须全部拥有。\\nGLM-4.5系列模型概览 认识一下新来的\\u0026quot;怪物\\u0026quot; 这次智谱AI一口气放出了两兄弟：\\nGLM-4.5： 完全体的\\u0026quot;六边形战士\\u0026quot;，拥有3550亿总参数，是本次的绝对主角，对标的就是全球最顶尖的那几个名字。 GLM-4.5-Air： 轻量级的\\u0026quot;敏捷刺客\\u0026quot;，参数更少，响应更快，但实力同样不容小觑。 它们最可怕的地方，在于一个叫做\\u0026quot;智能体（Agent）\\u0026ldquo;的能力。如果说以前的AI是在跟你\\u0026quot;对话\\u0026rdquo;，那GLM-4.5就是在\\u0026quot;替你办事\\u0026quot;。\\n革命性的代码生成能力 它不止会写代码，它在\\u0026quot;建工厂\\u0026quot;！ 别再拿\\u0026quot;能写个排序算法\\u0026quot;来衡量AI了，那都是\\u0026quot;石器时代\\u0026quot;的玩法。\\nGLM-4.5的代码能力已经进化到了\\u0026quot;创世纪\\u0026quot;的级别。在发布的技术演示中，它就像一个经验丰富的全栈工程师，你只需要动动嘴，它就能：\\n开发一个完整的网站： 从前端界面到后端数据库，一条龙服务。演示中的\\u0026quot;宝可梦图鉴\\u0026quot;网站，就是它从零开始构建的，用户体验和功能完整度堪比专业团队作品。 制作一个游戏： 像\\u0026quot;Flappy Bird\\u0026quot;这样的小游戏，它能直接生成可玩的HTML文件，让你在对话框里当场开玩。 设计精美的PPT： 你丢给它一份PDF文档，或者只给一个主题，比如\\u0026quot;介绍环法自行车赛冠军Pogačar的成就\\u0026quot;，它能自己上网搜集资料、找图片，然后生成一份图文并茂、设计感十足的PPT。 代码能力测试成绩 在专业的代码能力测评（SWE-bench）中，GLM-4.5的成绩（64.2%）已经超过了像Claude 4 Sonnet（70.4%对配置要求更高）和**GPT-4.1（48.6%）**这样的强大对手，在同等规模的模型里，它的表现堪称恐怖。\\n强大的推理能力 推理能力：它像个\\u0026quot;老谋深算\\u0026quot;的军师 这次GLM-4.5内置了一种\\u0026quot;思考模式\\u0026quot;。当你遇到复杂的数学题、科学问题或逻辑谜题时，它不再是凭\\u0026quot;语感\\u0026quot;瞎猜，而是会像一个真正的专家一样，启动深度思考，一步步推导演算，最后给出答案。\\n在**AIME（美国数学邀请赛）和GPQA（谷歌出品的高难度问答）**这类考验智商天花板的测试中，它的表现稳居第一梯队，证明了它不光\\u0026quot;能干活\\u0026quot;，还\\u0026quot;有脑子\\u0026quot;。\\n全球AI模型排名对比 硬碰硬！全球AI华山论剑，它排第几？ 当然，说得再好，不如直接上战绩。\\n智谱AI这次非常\\u0026quot;讲武德\\u0026quot;，直接把GLM-4.5拉到了一个包含12项权威基准测试的\\u0026quot;角斗场\\u0026quot;里，和来自OpenAI、Anthropic、谷歌、阿里、月之暗面等全球顶级玩家的旗舰模型进行了一场全方位大比拼。\\n结果如何？\\nGLM-4.5，综合排名全球第三。 GLM-4.5-Air，综合排名全球第六。 这意味着什么？这意味着在全球AI的牌桌上，已经有了一个不容忽视的中国玩家，它用实力证明了自己，不是\\u0026quot;另一个GPT\\u0026quot;，而是真正的\\u0026quot;顶级挑战者\\u0026quot;。\\n技术架构创新 揭秘\\u0026quot;黑科技\\u0026quot;：它为什么这么强？ 强大的能力背后，是技术的革新。智谱这次也亮出了他们的\\u0026quot;武功秘籍\\u0026quot;：\\n更聪明的\\u0026quot;专家混合（MoE）\\u0026ldquo;架构： 如果把普通模型比作一个全科医生，MoE就是组建了一
