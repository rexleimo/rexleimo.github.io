<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/></marker></defs>
  <rect x="0" y="0" width="900" height="340" fill="#0f172a" rx="14"/>
  <g font-size="17" fill="#e2e8f0">
    <rect x="28" y="60" width="190" height="90" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="123" y="100" text-anchor="middle" fill="#f8fafc">用户 / Client</text>
    <text x="123" y="124" text-anchor="middle" font-size="13" fill="#94a3b8">your-site.com</text>
    <rect x="355" y="60" width="190" height="90" rx="10" fill="#1e293b" stroke="#3b82f6"/>
    <text x="450" y="96" text-anchor="middle" fill="#60a5fa">Cloudflare</text>
    <text x="450" y="120" text-anchor="middle" font-size="13" fill="#94a3b8">Custom Domain + Worker</text>
    <rect x="682" y="60" width="190" height="90" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="777" y="96" text-anchor="middle" fill="#f8fafc">后端</text>
    <text x="777" y="120" text-anchor="middle" font-size="13" fill="#94a3b8">WordPress (PHP)</text>
    <path d="M218,105 L350,105" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah)"/>
    <path d="M545,105 L677,105" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah)"/>
  </g>
  <g font-size="13" fill="#cbd5e1">
    <rect x="40" y="200" width="820" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="62" y="230" fill="#f1f5f9" font-size="15">Worker 脚本做的事</text>
    <text x="62" y="258">1. 把 https://your-site.com/ 请求的 Host 改成后端真实域名</text>
    <text x="62" y="280">2. fetch 转发到 WordPress 后端，再把响应原样返回给用户</text>
  </g>
</svg>