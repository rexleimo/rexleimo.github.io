<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid decoration lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Title Badge -->
  <rect x="80" y="50" width="180" height="34" rx="17" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="73" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AGENT 架构演进实战</text>

  <!-- Main Headline -->
  <text x="80" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">
    DeepSeek Support Agent · Grok Bot · OpenManus
  </text>
  <text x="80" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">
    企业级确定性闭环 vs 开放网络沙盒 vs 实时多模态社交调度
  </text>

  <!-- 3 Comparison Cards -->
  <!-- Card 1: DeepSeek Support Agent -->
  <g transform="translate(80, 205)">
    <rect width="325" height="360" rx="16" fill="url(#blueCard)" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="325" height="60" rx="16" fill="#0369a1" fill-opacity="0.3"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">DeepSeek Support Agent</text>
    <text x="24" y="90" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">定位：高确定性企业/运维服务</text>

    <!-- Specs -->
    <text x="24" y="130" fill="#94a3b8" font-size="13">核心引擎：</text>
    <text x="95" y="130" fill="#e2e8f0" font-size="13" font-weight="600">DeepSeek-V3 / R1 推理链</text>

    <text x="24" y="165" fill="#94a3b8" font-size="13">执行架构：</text>
    <text x="95" y="165" fill="#e2e8f0" font-size="13" font-weight="600">受控企业知识库 + 权限栅栏</text>

    <text x="24" y="200" fill="#94a3b8" font-size="13">工具调用：</text>
    <text x="95" y="200" fill="#e2e8f0" font-size="13" font-weight="600">沙盒只读/白名单工单写回</text>

    <text x="24" y="235" fill="#94a3b8" font-size="13">上下文管理：</text>
    <text x="105" y="235" fill="#e2e8f0" font-size="13" font-weight="600">KV-Cache 前缀复用 + 压缩</text>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="280" width="277" height="55" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="304" fill="#38bdf8" font-size="13" font-weight="700">🎯 核心价值：99.9% 事实严谨性</text>
    <text x="36" y="324" fill="#64748b" font-size="12">防幻觉、私有数据对齐、极低单次 Token 成本</text>
  </g>

  <!-- Card 2: OpenManus -->
  <g transform="translate(437, 205)">
    <rect width="325" height="360" rx="16" fill="url(#blueCard)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="325" height="60" rx="16" fill="#6d28d9" fill-opacity="0.3"/>
    <text x="24" y="38" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">OpenManus (开源自主体)</text>
    <text x="24" y="90" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">定位：通用全自主任务解决者</text>

    <!-- Specs -->
    <text x="24" y="130" fill="#94a3b8" font-size="13">核心引擎：</text>
    <text x="95" y="130" fill="#e2e8f0" font-size="13" font-weight="600">任意 LLM (GPT-4o/Claude/DS)</text>

    <text x="24" y="165" fill="#94a3b8" font-size="13">执行架构：</text>
    <text x="95" y="165" fill="#e2e8f0" font-size="13" font-weight="600">ReAct 动态循环 + 浏览器自主</text>

    <text x="24" y="200" fill="#94a3b8" font-size="13">工具调用：</text>
    <text x="95" y="200" fill="#e2e8f0" font-size="13" font-weight="600">Python 脚本执行 + 网页爬取交互</text>

    <text x="24" y="235" fill="#94a3b8" font-size="13">运行环境：</text>
    <text x="95" y="235" fill="#e2e8f0" font-size="13" font-weight="600">本地系统权限 / 容器沙盒</text>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="280" width="277" height="55" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="304" fill="#c084fc" font-size="13" font-weight="700">⚡ 核心价值：端到端复杂任务闭环</text>
    <text x="36" y="324" fill="#64748b" font-size="12">自主写代码、查文档、下载整理出报告</text>
  </g>

  <!-- Card 3: Grok Bot -->
  <g transform="translate(795, 205)">
    <rect width="325" height="360" rx="16" fill="url(#blueCard)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="325" height="60" rx="16" fill="#047857" fill-opacity="0.3"/>
    <text x="24" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Grok Bot (xAI 生态)</text>
    <text x="24" y="90" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">定位：即时全网实时感知与交互</text>

    <!-- Specs -->
    <text x="24" y="130" fill="#94a3b8" font-size="13">核心引擎：</text>
    <text x="95" y="130" fill="#e2e8f0" font-size="13" font-weight="600">Grok-3 / Grok-2 系列大模型</text>

    <text x="24" y="165" fill="#94a3b8" font-size="13">数据来源：</text>
    <text x="95" y="165" fill="#e2e8f0" font-size="13" font-weight="600">X (Twitter) 毫秒级原生实时流</text>

    <text x="24" y="200" fill="#94a3b8" font-size="13">工具调用：</text>
    <text x="95" y="200" fill="#e2e8f0" font-size="13" font-weight="600">实时网络索引、生图、代码运行</text>

    <text x="24" y="235" fill="#94a3b8" font-size="13">风格人格：</text>
    <text x="95" y="235" fill="#e2e8f0" font-size="13" font-weight="600">直率诙谐、极强时效事件理解</text>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="280" width="277" height="55" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="304" fill="#34d399" font-size="13" font-weight="700">🌐 核心价值：零延迟社会脉搏响应</text>
    <text x="36" y="324" fill="#64748b" font-size="12">突发热点挖掘、社媒情绪追踪、强推理</text>
  </g>
</svg>
