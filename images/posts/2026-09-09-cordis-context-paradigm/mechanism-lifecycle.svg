<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1040" height="660" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="bold" fill="#0f172a">fiber 生命周期状态机：谁先上、谁先下</text>
  <text x="40" y="74" font-size="15" fill="#64748b">论文 §4.2 图 1 / 算法 5 —— 九条规则驱动；提供方下线必须让依赖方先走（guard）</text>

  <!-- 状态节点 -->
  <rect x="50" y="300" width="150" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="125" y="328" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">absent</text>
  <text x="125" y="350" font-size="12" fill="#94a3b8" text-anchor="middle">尚未插入</text>

  <rect x="270" y="300" width="150" height="64" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="345" y="328" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">inactive</text>
  <text x="345" y="350" font-size="12" fill="#94a3b8" text-anchor="middle">已注册未激活</text>

  <rect x="510" y="150" width="150" height="64" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="585" y="178" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">loading</text>
  <text x="585" y="200" font-size="12" fill="#1e40af" text-anchor="middle">激活中（效应入栈）</text>

  <rect x="760" y="150" width="150" height="64" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="835" y="178" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">active</text>
  <text x="835" y="200" font-size="12" fill="#166534" text-anchor="middle">运行中（对外提供）</text>

  <rect x="510" y="450" width="150" height="64" rx="12" fill="#ffedd5" stroke="#f97316"/>
  <text x="585" y="478" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">unloading</text>
  <text x="585" y="500" font-size="12" fill="#9a3412" text-anchor="middle">下线中（已停止被依赖）</text>

  <!-- 边 -->
  <path d="M200,332 L268,332" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="234" y="316" font-size="12.5" fill="#475569" text-anchor="middle">O-Insert</text>
  <text x="234" y="366" font-size="11.5" fill="#94a3b8" text-anchor="middle">编排器插入</text>

  <path d="M392,296 C440,240 460,210 506,192" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="428" y="228" font-size="12.5" fill="#475569">L-Begin</text>
  <text x="404" y="252" font-size="11.5" fill="#2563eb">依赖齐 · 目标视图非空</text>

  <path d="M660,182 L758,182" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="709" y="166" font-size="12.5" fill="#475569" text-anchor="middle">L-Iter … L-Finish</text>
  <text x="709" y="204" font-size="11.5" fill="#94a3b8" text-anchor="middle">提交解析视图</text>

  <path d="M760,232 C700,300 660,360 616,446" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="726" y="330" font-size="12.5" fill="#c2410c">L-Leave</text>
  <text x="676" y="354" font-size="11.5" fill="#ea580c">目标变化：依赖被替换/撤销</text>
  <text x="676" y="372" font-size="11.5" fill="#ea580c">先摘「可见提供」，绑定暂留</text>

  <path d="M560,442 C540,380 530,290 548,218" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="330" font-size="12.5" fill="#475569">L-Divert</text>
  <text x="394" y="354" font-size="11.5" fill="#64748b">激活中途撤销：</text>
  <text x="394" y="372" font-size="11.5" fill="#64748b">只回放已入栈的回执</text>

  <path d="M662,490 C740,490 760,420 806,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M806,300 C820,262 828,234 832,218" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="790" y="400" font-size="12.5" fill="#475569">L-Unload</text>
  <text x="806" y="424" font-size="11.5" fill="#15803d">guard：依赖方已全部离开</text>
  <text x="806" y="442" font-size="11.5" fill="#15803d">→ 回执回放 → 回到 inactive</text>

  <path d="M345,300 C345,420 420,470 506,482" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="352" y="494" font-size="12.5" fill="#475569">O-Retire → L-Unload</text>
  <text x="352" y="512" font-size="11.5" fill="#94a3b8">（先退休，再按 guard 下线）</text>

  <path d="M270,364 C220,400 190,410 152,368" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="128" y="420" font-size="12.5" fill="#475569">O-Remove</text>
  <text x="94" y="444" font-size="11.5" fill="#94a3b8">表已空才可移除</text>

  <!-- 右侧：反应式引擎 -->
  <rect x="40" y="520" width="560" height="110" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="552" font-size="15.5" font-weight="bold" fill="#1d4ed8">反应式引擎（为何不死锁）</text>
  <text x="64" y="578" font-size="13" fill="#334155">依赖变化 → notify → refresh 重算目标视图（提供者 uid 摘要）</text>
  <text x="64" y="600" font-size="13" fill="#334155">与 committed 比较 → 不同则触发转换</text>
  <text x="64" y="622" font-size="13" fill="#334155">提供方 Leave 后目标变空 → 依赖方随之下线 → 等待链必然走完</text>

  <rect x="630" y="520" width="370" height="110" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="654" y="552" font-size="15.5" font-weight="bold" fill="#c2410c">两条铁律</text>
  <text x="654" y="578" font-size="13" fill="#334155">单一来源：一个键同时最多一个提供者</text>
  <text x="654" y="606" font-size="13" fill="#334155">级联卸载：实例化是普通效应，父卸载带走子 fiber</text>
</svg>
