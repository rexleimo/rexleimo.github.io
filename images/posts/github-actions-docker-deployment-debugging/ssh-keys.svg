<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="24" fill="#17212b"/><g font-family="Arial,sans-serif"><text x="55" y="65" font-size="28" font-weight="700" fill="#fff">SSH public-key authentication</text><text x="55" y="100" font-size="17" fill="#9fb1bc">The private key travels through GitHub Secrets; the public key is authorized on the VPS.</text></g><rect x="70" y="185" width="250" height="210" rx="18" fill="#243746" stroke="#f27b52" stroke-width="3"/><rect x="680" y="185" width="250" height="210" rx="18" fill="#243746" stroke="#35c6c9" stroke-width="3"/><g font-family="Arial,sans-serif"><text x="105" y="235" font-size="24" fill="#f27b52" font-weight="700">GitHub Actions</text><text x="105" y="285" font-size="18" fill="#fff">private key</text><text x="105" y="325" font-size="16" fill="#9fb1bc">DEPLOY_SSH_KEY</text><text x="715" y="235" font-size="24" fill="#35c6c9" font-weight="700">VPS</text><text x="715" y="285" font-size="18" fill="#fff">public key</text><text x="715" y="325" font-size="16" fill="#9fb1bc">authorized_keys</text><text x="715" y="355" font-size="15" fill="#9fb1bc">user home/.ssh/</text><path d="M320 290h360" stroke="#f27b52" stroke-width="5" stroke-dasharray="12 10"/><path d="m665 277 24 13-24 13z" fill="#f27b52"/><text x="380" y="260" font-size="17" fill="#6fe0d2">same fingerprint</text></g><circle cx="500" cy="410" r="42" fill="#35c6c9" opacity=".2" stroke="#35c6c9" stroke-width="3"/><path d="M478 410h44M500 388v44" stroke="#35c6c9" stroke-width="5"/><text x="425" y="500" font-family="Arial,sans-serif" font-size="18" fill="#f27b52">Different fingerprint = authentication failure</text></svg>