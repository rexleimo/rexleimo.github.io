<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="24" fill="#f4f7f8"/><g font-family="Arial,sans-serif"><text x="55" y="65" font-size="28" font-weight="700" fill="#17212b">Two places, two responsibilities</text><text x="55" y="100" font-size="17" fill="#687783">Runtime configuration stays on the server; deployment access stays in GitHub.</text></g><rect x="55" y="145" width="390" height="315" rx="18" fill="#fff" stroke="#35aeb0" stroke-width="3"/><rect x="555" y="145" width="390" height="315" rx="18" fill="#fff" stroke="#f27b52" stroke-width="3"/><g font-family="Arial,sans-serif"><text x="85" y="195" font-size="25" font-weight="700" fill="#167d80">VPS</text><text x="85" y="230" font-size="19" fill="#17212b">deploy/.env</text><text x="90" y="285" font-size="18" fill="#40515c">ADMIN_JWT_SECRET</text><text x="90" y="325" font-size="18" fill="#40515c">WECHAT_SECRET</text><text x="90" y="365" font-size="18" fill="#40515c">container runtime</text><text x="90" y="415" font-size="16" fill="#87939a">Never commit to GitHub</text><text x="585" y="195" font-size="25" font-weight="700" fill="#c45432">GitHub</text><text x="585" y="230" font-size="19" fill="#17212b">production secrets</text><text x="590" y="285" font-size="18" fill="#40515c">DEPLOY_HOST</text><text x="590" y="325" font-size="18" fill="#40515c">DEPLOY_USER</text><text x="590" y="365" font-size="18" fill="#40515c">DEPLOY_SSH_KEY</text><text x="590" y="415" font-size="16" fill="#87939a">Settings → Secrets → Actions</text><path d="M445 300h110" stroke="#f27b52" stroke-width="5"/><path d="m535 287 22 13-22 13z" fill="#f27b52"/></g></svg>