<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="24" fill="#f4f7f8"/><g font-family="Arial,sans-serif"><text x="55" y="65" font-size="28" font-weight="700" fill="#17212b">Build inside Docker, run without Go on the VPS</text><text x="55" y="100" font-size="17" fill="#687783">The builder image owns the compiler; the host only needs Docker and Compose.</text></g><rect x="55" y="155" width="260" height="285" rx="18" fill="#17212b"/><rect x="370" y="155" width="260" height="285" rx="18" fill="#fff" stroke="#35aeb0" stroke-width="3"/><rect x="685" y="155" width="260" height="285" rx="18" fill="#fff" stroke="#f27b52" stroke-width="3"/><g font-family="Arial,sans-serif"><text x="85" y="205" font-size="23" fill="#f27b52" font-weight="700">Builder image</text><text x="85" y="255" font-size="18" fill="#fff">Go compiler</text><text x="85" y="295" font-size="18" fill="#fff">server binary</text><text x="85" y="335" font-size="18" fill="#fff">publish tool</text><text x="400" y="205" font-size="23" fill="#167d80" font-weight="700">Runtime image</text><text x="400" y="255" font-size="18" fill="#40515c">Alpine</text><text x="400" y="295" font-size="18" fill="#40515c">compiled binaries</text><text x="400" y="335" font-size="18" fill="#40515c">API service</text><text x="715" y="205" font-size="23" fill="#c45432" font-weight="700">VPS host</text><text x="715" y="255" font-size="18" fill="#40515c">Docker</text><text x="715" y="295" font-size="18" fill="#40515c">Compose</text><text x="715" y="335" font-size="18" fill="#40515c">no Go required</text><path d="M315 295h55M630 295h55" stroke="#f27b52" stroke-width="5"/><path d="m350 282 22 13-22 13zM665 282 687 295l-22 13z" fill="#f27b52"/></g></svg>